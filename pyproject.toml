[project]
name = "almanak"
version = "3.3.1"
description = "Almanak SDK: explicit protocol inputs for autonomous DeFi strategies"
readme = "PYPI.md"
license = "Apache-2.0"
license-files = ["LICENSE", "third_party/*-LICENSE.txt"]
authors = [{ name = "Almanak", email = "engineering@almanak.co" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.12"
dependencies = [
    "eth-abi>=6.0.0,<7",
    "eth-account>=0.14.0,<0.15",
    "eth-hash[pycryptodome]>=0.8,<0.9",
    "eth-utils>=6.0.0,<7",
    "httpx>=0.28,<0.29",
    "msgpack>=1.1,<2",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2.4,<2",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://almanak.co"
Documentation = "https://docs.almanak.co"
Repository = "https://github.com/almanak-co/sdk"
Issues = "https://github.com/almanak-co/sdk/issues"
Changelog = "https://github.com/almanak-co/sdk/blob/main/CHANGELOG.md"

[project.scripts]
almanak = "almanak.cli:main"

[project.optional-dependencies]
# Python LSP for the bundled Almanak Code binary, which spawns
# pyright-langserver from PATH and falls back to npx when absent.
code = ["pyright>=1.1.414"]
# Technical analysis over declared strategy price series (`ctx.prices`); the SDK itself
# computes no indicators. Install it where strategies run: `almanak[ta]`.
ta = ["numpy>=2,<3", "TA-Lib>=0.6,<0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/almanak"]
# The binaries and the generated LLM docs bundle are gitignored, so hatchling's
# VCS-based selection skips them unless they are named here. Only the wheel
# carries them; an sdist is platform neutral and cannot describe which binary
# it holds.
artifacts = ["src/almanak/bin/almanak-code-*", "src/almanak/llms/llms-full.txt"]

[tool.hatch.build.targets.sdist]
# Only what a wheel build from the sdist needs. The whole checkout (test
# fixtures alone are ~100 MB) would reach PyPI's file size limit and publish
# repository internals with the package.
only-include = [
    "src/almanak",
    "docs/schemas",
    "strategies",
    "scripts/hatch_build.py",
    "PYPI.md",
    "LICENSE",
    "third_party",
]
# An sdist carries no platform tag, so it must never carry a platform binary.
exclude = ["src/almanak/bin/almanak-code-*"]

[tool.hatch.build.targets.wheel.force-include]
"docs/schemas" = "almanak/schemas/files"

[tool.hatch.build.targets.wheel.hooks.custom]
# Copies each reference strategy's author files from strategies/, the single
# source, into almanak/references/files for `almanak support --references`.
path = "scripts/hatch_build.py"

[dependency-groups]
dev = [
    "coverage>=7.16.2,<8",
    "defusedxml>=0.7,<1",
    "hypothesis>=6,<7",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0,<3",
    # The ta extra, so the RSI reference strategy type-checks and its tests run.
    "numpy>=2,<3",
    "packaging>=26,<27",
    "pre-commit>=4.6,<5",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-split>=0.10,<1",
    "pytest-xdist>=3.8,<4",
    "radon>=6,<7",
    "ruff>=0.16.10",
    "TA-Lib>=0.6,<0.9",
    "types-pyyaml>=6,<7",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-llmstxt>=0.5.1,<1",
    "mkdocs-material>=9.7,<10",
    "mkdocs-static-i18n>=1.2,<2",
    "mkdocstrings[python]>=1.0.6,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# xunit1 keeps the `file` attribute on each testcase; the shard duration merge
# needs it to rebuild pytest node IDs for class-based tests.
junit_family = "xunit1"
markers = [
    "fork: explicit EVM fork proof requiring Anvil and --fork-env",
    "strategy_fork: automatically discovered strategy lifecycle on a configured fork",
]

[tool.crap]
max-score = 30

# Statement coverage floors in percent, keyed by directory, scored by
# scripts/check_crap.py from the same coverage as the CRAP gate. Every file
# below the directory counts, unimported files included.
[tool.crap.coverage-floor]
src = 87

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "src"
files = ["src", "strategies", "scripts"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Radon, defusedxml and msgpack do not publish type information, and hatchling and the
# official Hyperliquid SDK (fixture generation only) exist only in their isolated
# environments; repository code remains checked.
module = ["radon.*", "defusedxml.*", "hatchling.*", "msgpack", "hyperliquid.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
