# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/uniswap_v4_base_lp.fork.yaml.
strategy:
  decision_interval: 60s
  allocations:
    lp:
      market: lp_market
      account: lp
      range:
        lower: -887220
        upper: 887220
      capital:
        asset: eip155:8453/erc20:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
        quantity: '100'
      hold_seconds: 43200s
      collect_seconds: 21600s
      slippage_bps: 100
      deadline_seconds: 300s
      minimum_native_balance: '0.001'
      kind: liquidity
markets:
  lp_market:
    connector: uniswap_v4
    chain: eip155:8453
    currency0: eip155:8453/erc20:0x4200000000000000000000000000000000000006
    currency1: eip155:8453/erc20:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
    fee: 3000
    tick_spacing: 60
    hooks: '0x0000000000000000000000000000000000000000'
accounts:
  lp:
    chain: eip155:8453
