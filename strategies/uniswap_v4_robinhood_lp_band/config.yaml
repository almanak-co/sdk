# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/uniswap_v4_robinhood_lp_band.fork.yaml.
strategy:
  decision_interval: 60s
  allocations:
    position:
      market: pool
      account: fund
      band:
        lower: -200130
        upper: -196130
        width_bps: 500
      capital:
        asset: eip155:4663/erc20:0x5fc5360d0400a0fd4f2af552add042d716f1d168
        quantity: '5'
      hold_seconds: 300s
      slippage_bps: 100
      deadline_seconds: 300
      # 0 only because both pool currencies are ERC-20; a native-coin pool needs gas
      # headroom here (README).
      minimum_native_balance:
        base_units: 0
      kind: liquidity
  gas:
    # Example Robinhood Chain amounts; size them from the live gas price.
    # Entry takes 1 transaction and exit 5 (almanak check --production):
    # exit_reserve = 5 fees, total_budget = exit_reserve + 1 entry + 20 later fees.
    fund_payer:
      accounts:
      - fund
      chain: eip155:4663
      max_transaction_fee:
        base_units: 160000000000000
      total_budget:
        base_units: 4160000000000000
      exit_reserve:
        base_units: 800000000000000
markets:
  pool:
    connector: uniswap_v4
    chain: eip155:4663
    currency0: eip155:4663/erc20:0x0bd7d308f8e1639fab988df18a8011f41eacad73
    currency1: eip155:4663/erc20:0x5fc5360d0400a0fd4f2af552add042d716f1d168
    fee: 500
    tick_spacing: 10
    hooks: '0x0000000000000000000000000000000000000000'
accounts:
  fund:
    chain: eip155:4663
