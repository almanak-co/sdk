strategy:
  decision_interval: 60s
  parameters:
    # What the loan allocation borrows, in its asset's units.
    borrow_quantity: '5'
  allocations:
    ethereum_collateral:
      market: ethereum_collateral
      account: ethereum
      capital: '0.01'
      collateral: true
      minimum_health_factor: '2'
      oracle: '0x54586be62e3c3580375ae3723c145253060ca0c2'
      price_source: '0x5424384b256154046e9667ddfaaa5e550145215e'
      minimum_native_balance: '0'
    ethereum_loan:
      market: ethereum_loan
      account: ethereum
      borrow: true
      collateral: false
      minimum_health_factor: '2'
      oracle: '0x54586be62e3c3580375ae3723c145253060ca0c2'
      price_source: '0x3f73f03aa83b2a48ed27e964ed0fdb590332095b'
      minimum_native_balance: '0'
    ethereum_trade:
      market: ethereum_pool
      account: ethereum
      capital:
        asset: eip155:1/erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
        quantity:
          base_units: 2500000
      entry_swap_bps: 10000
      slippage_bps: 100
      deadline_seconds: 300
      minimum_native_balance:
        base_units: 0
    base_collateral:
      market: base_collateral
      account: base
      capital: '0.01'
      collateral: true
      minimum_health_factor: '2'
      oracle: '0x2cc0fc26ed4563a5ce5e8bdcfe1a2878676ae156'
      price_source: '0x9da00d23465282005db222a441a663ee7b9dfcc8'
      minimum_native_balance: '0'
    base_loan:
      market: base_loan
      account: base
      borrow: true
      collateral: false
      minimum_health_factor: '2'
      oracle: '0x2cc0fc26ed4563a5ce5e8bdcfe1a2878676ae156'
      price_source: '0xf52d010c7d4ecbfda92c2509900593ce34535d86'
      minimum_native_balance: '0'
    base_trade:
      market: base_pool
      account: base
      capital:
        asset: eip155:8453/erc20:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
        quantity:
          base_units: 2500000
      entry_swap_bps: 10000
      slippage_bps: 100
      deadline_seconds: 300
      minimum_native_balance:
        base_units: 0
