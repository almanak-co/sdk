# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/morpho_blue_hyperevm_lending.fork.yaml.
strategy:
  decision_interval: 60s
  parameters:
    # What the loan allocation borrows, in its asset's units.
    borrow_quantity: '200'
  allocations:
    earn:
      market: earn
      account: lender
      capital: '1000'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    collateral:
      market: collateral
      account: borrower
      capital: '20'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    loan:
      market: loan
      account: borrower
      borrow: true
      minimum_health_factor: '2'
      minimum_native_balance: '0'
markets:
  earn:
    connector: morpho_blue
    chain: eip155:999
    market_id: '0xd7d38220652d19c87099c3b23de9a70a1893620a050c635d1a94bd947c9c59a8'
    leg: loan
  collateral:
    connector: morpho_blue
    chain: eip155:999
    market_id: '0xd7d38220652d19c87099c3b23de9a70a1893620a050c635d1a94bd947c9c59a8'
    leg: collateral
  loan:
    connector: morpho_blue
    chain: eip155:999
    market_id: '0xd7d38220652d19c87099c3b23de9a70a1893620a050c635d1a94bd947c9c59a8'
    leg: loan
accounts:
  lender:
    chain: eip155:999
  borrower:
    chain: eip155:999
