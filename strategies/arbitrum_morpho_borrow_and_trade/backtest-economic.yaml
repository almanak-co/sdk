# yaml-language-server: $schema=../../docs/schemas/backtest.schema.json
mode: economic
window:
  start: '2026-09-08T08:17:07Z'
  end: '2026-09-08T08:17:37Z'
  end_policy: teardown
  cleanup: 60s
inventory:
  funds:
    fund:
      balances:
      - asset: eip155:42161/erc20:0x82af49447d8a07e3bd95bd0d56f35241523fbab1
        quantity: '0.01'
      - asset: eip155:42161/erc20:0xaf88d065e77c8cc2239327c5edb3a432268e5831
        quantity: '2'
      - asset: eip155:42161/slip44:60
        quantity: '5'
execution:
  latency: 1s
  models:
    uniswap_v3:
      swap_model: prepared_integer_pool
      liquidity_model: null
    morpho_blue:
      liquidation_model: immediate_morpho_liquidation
data:
  connectors:
    uniswap_v3:
      source: uniswap_v3_archive
      sample_seconds: 60s
      max_age_seconds: 72s
      max_samples: 10
      max_bitmap_words: 100
      max_initialized_ticks: 10000
      max_liquidity_events: 10000
      max_liquidity_log_requests: 1000
      coverage:
      - allocation: trade
        lower: -200690
        upper: -195690
    morpho_blue:
      source: morpho_blue_archive
      risk_model: morpho_oracle_each_block
      sample_seconds: 30s
      max_age_seconds: 60s
      max_accounting_samples: 10
      max_risk_blocks: 512
      max_risk_samples: 512
      max_liquidations_per_event: 8
costs:
  uniswap_v3:
    kind: excluded
  morpho_blue:
    kind: excluded
