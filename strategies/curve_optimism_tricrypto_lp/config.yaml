strategy:
  decision_interval: 60s
  allocations:
    proportional:
      market: crypto_pool
      account: proportional
      funding_asset: eip155:10/erc20:0x4200000000000000000000000000000000000006
      trading_asset: eip155:10/erc20:0xc52d7f23a2e460248db6ee192cb23dd12bddcbf6
      liquidity_enabled: true
      capital:
      - asset: eip155:10/erc20:0xc52d7f23a2e460248db6ee192cb23dd12bddcbf6
        quantity: '0'
      - asset: eip155:10/erc20:0x68f180fcce6836688e9084f035309e29bf0a2095
        quantity: '0'
      - asset: eip155:10/erc20:0x4200000000000000000000000000000000000006
        quantity: '0.00001'
      entry_swap_bps: 5000
      hold_seconds: 2h
      slippage_bps: 100
      deadline_seconds: 5m
      minimum_native_balance:
        base_units: 0
    single_coin:
      market: crypto_pool
      account: single_coin
      funding_asset: eip155:10/erc20:0x4200000000000000000000000000000000000006
      trading_asset: eip155:10/erc20:0xc52d7f23a2e460248db6ee192cb23dd12bddcbf6
      liquidity_enabled: true
      capital:
      - asset: eip155:10/erc20:0xc52d7f23a2e460248db6ee192cb23dd12bddcbf6
        quantity: '0'
      - asset: eip155:10/erc20:0x68f180fcce6836688e9084f035309e29bf0a2095
        quantity: '0'
      - asset: eip155:10/erc20:0x4200000000000000000000000000000000000006
        quantity: '0.00001'
      entry_swap_bps: 5000
      hold_seconds: 2h
      slippage_bps: 100
      deadline_seconds: 5m
      minimum_native_balance:
        base_units: 0
      single_coin_exit: eip155:10/erc20:0x4200000000000000000000000000000000000006
markets:
  crypto_pool:
    connector: curve
    chain: eip155:10
    pool: '0x4456d13fc6736e8e8330394c0c622103e06ea419'
accounts:
  proportional:
    chain: eip155:10
  single_coin:
    chain: eip155:10
