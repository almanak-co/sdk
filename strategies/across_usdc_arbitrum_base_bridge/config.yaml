# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/across_usdc_arbitrum_base_bridge.fork.yaml.
strategy:
  decision_interval: 60s
  parameters:
    # What the strategy bridges, once, in USDC.
    bridge_quantity: '100'
  allocations:
    move:
      market: usdc_to_base
      # The account that sends, on the market's chain.
      account: arbitrum_fund
      # The account that receives, on the market's destination chain.
      destination_account: base_fund
      capital: '100'
      minimum_native_balance: '0.0001'
  gas:
    # Arbitrum One values; gas ceilings are chain-specific, never copy them to another chain.
    # A bridge takes 2 transactions, an approval and the deposit, and teardown at most 1,
    # a revoke of an approval whose deposit was never mined:
    # max_transaction_fee >= max_gas_limit x max_gas_price_wei;
    # exit_reserve >= 1 fee; total_budget >= 2 entry fees + exit_reserve.
    # Every bound account has a policy. The receiving account on Base signs nothing
    # in this strategy, so its policy is a ceiling that is never spent.
    arbitrum_payer:
      accounts:
      - arbitrum_fund
      chain: eip155:42161
      source: network_rpc_fee_history
      reward_percentile: 50
      base_fee_multiplier_bps: 12500
      max_gas_price_wei: 150000000
      max_gas_limit: 1000000
      max_transaction_fee:
        base_units: 150000000000000
      total_budget:
        base_units: 600000000000000
      exit_reserve:
        base_units: 150000000000000
    # Base (OP Stack) values.
    base_payer:
      accounts:
      - base_fund
      chain: eip155:8453
      source: network_rpc_fee_history
      reward_percentile: 50
      base_fee_multiplier_bps: 20000
      max_gas_price_wei: 150000000
      max_gas_limit: 1000000
      max_transaction_fee:
        base_units: 160000000000000
      total_budget:
        base_units: 160000000000000
      exit_reserve:
        base_units: 0
markets:
  # One direction. Bridging back is another market.
  usdc_to_base:
    connector: across
    chain: eip155:42161
    asset: eip155:42161/erc20:0xaf88d065e77c8cc2239327c5edb3a432268e5831
    destination_chain: eip155:8453
    destination_asset: eip155:8453/erc20:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
    # The most the whole bridge may cost, in basis points of the amount sent.
    max_fee_bps: 10
    # Where the received amount comes from: Across's own quote. Nothing substitutes it.
    quote: across_api
accounts:
  arbitrum_fund:
    chain: eip155:42161
  base_fund:
    chain: eip155:8453
