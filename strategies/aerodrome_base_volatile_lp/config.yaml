# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/aerodrome_base_volatile_lp.fork.yaml.
strategy:
  decision_interval: 60s
  allocations:
    position:
      market: pool
      account: fund
      liquidity_enabled: true
      capital:
        asset: eip155:8453/erc20:0x4200000000000000000000000000000000000006
        quantity: '0.1'
      entry_swap_bps: 5000
      hold_seconds: 2h
      slippage_bps: 100
      deadline_seconds: 300
      minimum_native_balance:
        base_units: 0
  gas:
    # Example Base amounts; size them from the live gas price.
    # Entry takes 1 transaction and exit 5 (almanak check --production):
    # exit_reserve = 5 fees, total_budget = exit_reserve + 1 entry + 20 later fees.
    fund_payer:
      accounts:
      - fund
      chain: eip155:8453
      max_transaction_fee:
        base_units: 75000000000000
      total_budget:
        base_units: 1950000000000000
      exit_reserve:
        base_units: 375000000000000
markets:
  pool:
    connector: aerodrome
    chain: eip155:8453
    pool: '0xcdac0d6c6c59727a65f871236188350531885c43'
accounts:
  fund:
    chain: eip155:8453
