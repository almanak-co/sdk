# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/gmx_v2_arbitrum_swap.fork.yaml.
strategy:
  decision_interval: 60s
  allocations:
    Main:
      kind: gmx_swap
      market: weth_usdc
      account: fund
      initial_inventory:
      - asset: eip155:42161/erc20:0x82af49447d8a07e3bd95bd0d56f35241523fbab1
        quantity: '0.5'
      - asset: eip155:42161/erc20:0xaf88d065e77c8cc2239327c5edb3a432268e5831
        quantity: '0'
      execution_fee:
        asset: eip155:42161/erc20:0x82af49447d8a07e3bd95bd0d56f35241523fbab1
        quantity: '0.02'
      entry_amount:
        asset: eip155:42161/erc20:0x82af49447d8a07e3bd95bd0d56f35241523fbab1
        quantity: '0.1'
      entry_minimum_output:
        asset: eip155:42161/erc20:0xaf88d065e77c8cc2239327c5edb3a432268e5831
        quantity: '1'
      exit_minimum_output:
        asset: eip155:42161/erc20:0x82af49447d8a07e3bd95bd0d56f35241523fbab1
        quantity: '0.01'
      hold_seconds: 2m
      deadline_seconds: 5m
      maximum_event_block_span: 2000
      minimum_native_balance:
        base_units: 0
  gas:
    # Example Arbitrum amounts; size them from the live gas price.
    # GMX requests need more than the 1.2M default gas limit through Safe/Roles,
    # so this template states max_gas_limit; leave it, it is not a price.
    # Entry takes 1 transaction and exit 0 (almanak check --production):
    # exit_reserve keeps 1 fee, total_budget = exit_reserve + 1 entry + 20 later fees.
    fund_payer:
      accounts:
      - fund
      chain: eip155:42161
      max_gas_limit: 2300000
      max_transaction_fee:
        base_units: 300000000000000
      total_budget:
        base_units: 6600000000000000
      exit_reserve:
        base_units: 300000000000000
markets:
  weth_usdc:
    connector: gmx_v2
    chain: eip155:42161
    market: eip155:42161/erc20:0x70d95587d40a2caf56bd97485ab3eec10bee6336
accounts:
  fund:
    chain: eip155:42161
