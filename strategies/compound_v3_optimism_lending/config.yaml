# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/compound_v3_optimism_lending.fork.yaml.
strategy:
  decision_interval: 60s
  parameters:
    # What the loan allocation borrows, in its asset's units.
    borrow_quantity: '200'
  allocations:
    earn:
      market: earn
      account: lender
      capital: '1000'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    collateral:
      market: collateral
      account: borrower
      capital: '1'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    loan:
      market: loan
      account: borrower
      borrow: true
      minimum_health_factor: '2'
      minimum_native_balance: '0'
markets:
  earn:
    connector: compound_v3
    chain: eip155:10
    comet: '0x2e44e174f7d53f0212823acc11c01a11d58c5bcb'
    asset: eip155:10/erc20:0x0b2c639c533813f4aa9d7837caf62653d097ff85
  collateral:
    connector: compound_v3
    chain: eip155:10
    comet: '0x2e44e174f7d53f0212823acc11c01a11d58c5bcb'
    asset: eip155:10/erc20:0x4200000000000000000000000000000000000006
  loan:
    connector: compound_v3
    chain: eip155:10
    comet: '0x2e44e174f7d53f0212823acc11c01a11d58c5bcb'
    asset: eip155:10/erc20:0x0b2c639c533813f4aa9d7837caf62653d097ff85
accounts:
  lender:
    chain: eip155:10
  borrower:
    chain: eip155:10
