# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/polygon_aave_borrow_and_trade_v4.fork.yaml.
strategy:
  decision_interval: 60s
  parameters:
    # What the loan allocation borrows, in its asset's units.
    borrow_quantity: '5'
  allocations:
    collateral:
      market: collateral
      account: fund
      capital: '0.01'
      collateral: true
      minimum_health_factor: '2'
      oracle: '0xb023e699f5a33916ea823a16485e259257ca8bd1'
      price_source: '0xf9680d99d6c9589e2a93a78a04a279e509205945'
      minimum_native_balance: '0'
    loan:
      market: loan
      account: fund
      borrow: true
      collateral: false
      minimum_health_factor: '2'
      oracle: '0xb023e699f5a33916ea823a16485e259257ca8bd1'
      price_source: '0x31ebeb03223aac82c8eb24c77624ea40f4d849fb'
      minimum_native_balance: '0'
    trade:
      market: pool
      account: fund
      capital:
        asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
        quantity: '2.5'
      slippage_bps: 100
      deadline_seconds: 300
      minimum_native_balance:
        base_units: 0
      kind: trading
markets:
  collateral:
    connector: aave_v3
    chain: eip155:137
    asset: eip155:137/erc20:0x7ceb23fd6bc0add59e62ac25578270cff1b9f619
  loan:
    connector: aave_v3
    chain: eip155:137
    asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
  pool:
    connector: uniswap_v4
    chain: eip155:137
    currency0: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
    currency1: eip155:137/erc20:0x7ceb23fd6bc0add59e62ac25578270cff1b9f619
    fee: 500
    tick_spacing: 10
    hooks: '0x0000000000000000000000000000000000000000'
accounts:
  fund:
    chain: eip155:137
inventory:
- account: fund
  balance:
    asset: eip155:137/erc20:0x7ceb23fd6bc0add59e62ac25578270cff1b9f619
    quantity: '0.01'
- account: fund
  balance:
    asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
    quantity: '1'
