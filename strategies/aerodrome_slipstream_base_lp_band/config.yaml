# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/aerodrome_slipstream_base_lp_band.fork.yaml.
strategy:
  decision_interval: 60s
  allocations:
    position:
      market: pool
      account: fund
      band:
        lower: -200650
        upper: -195650
        width_bps: 500
      capital:
        asset: eip155:8453/erc20:0x4200000000000000000000000000000000000006
        quantity: '0.1'
      entry_swap_bps: 5000
      hold_seconds: 2h
      slippage_bps: 100
      deadline_seconds: 300
      # 0 only because both pool currencies are ERC-20; a native-coin pool needs gas
      # headroom here (README).
      minimum_native_balance:
        base_units: 0
  gas:
    # Example Base amounts; size them from the live gas price.
    # Entry takes 4 transactions and exit 5 (almanak check --production):
    # exit_reserve = 5 fees, total_budget = exit_reserve + 4 entry + 20 later fees.
    fund_payer:
      accounts:
      - fund
      chain: eip155:8453
      max_transaction_fee:
        base_units: 75000000000000
      total_budget:
        base_units: 2175000000000000
      exit_reserve:
        base_units: 375000000000000
markets:
  pool:
    connector: aerodrome_slipstream
    chain: eip155:8453
    pool: '0x3fe04a59ebd38cf06080a6f60a98d124eb59392a'
accounts:
  fund:
    chain: eip155:8453
