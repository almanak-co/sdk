# yaml-language-server: $schema=../../docs/schemas/backtest.schema.json
mode: economic
window:
  start: '2026-09-07T20:00:00+00:00'
  end: '2026-09-07T20:00:30+00:00'
  end_policy: teardown
  cleanup: 60s
inventory:
  funds:
    fund:
      balances:
      - asset: eip155:10/erc20:0x4200000000000000000000000000000000000006
        quantity: '0.01'
      - asset: eip155:10/erc20:0x0b2c639c533813f4aa9d7837caf62653d097ff85
        quantity: '2'
      - asset: eip155:10/erc20:0xc52d7f23a2e460248db6ee192cb23dd12bddcbf6
        quantity: '0'
      - asset: eip155:10/slip44:60
        quantity: '5'
execution:
  latency: 1s
  models:
    morpho_blue:
      liquidation_model: immediate_morpho_liquidation
    curve:
      swap_model: prepared_integer_pool
      liquidity_model: null
data:
  connectors:
    morpho_blue:
      source: morpho_blue_archive
      risk_model: morpho_oracle_each_block
      sample_seconds: 30s
      max_age_seconds: 60s
      max_accounting_samples: 10
      max_risk_blocks: 128
      max_risk_samples: 128
      max_liquidations_per_event: 8
    curve:
      source: curve_archive
      sample_seconds: 60s
      max_age_seconds: 120s
      max_samples: 100
      max_parameter_events: 100
      max_parameter_log_requests: 10
costs:
  morpho_blue:
    kind: excluded
  curve:
    kind: excluded
