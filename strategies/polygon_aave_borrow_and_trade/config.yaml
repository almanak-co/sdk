strategy:
  decision_interval: 60s
  parameters:
    # What the loan allocation borrows, in its asset's units.
    borrow_quantity: '5'
  allocations:
    collateral:
      market: collateral
      account: fund
      capital: '0.01'
      collateral: true
      minimum_health_factor: '2'
      oracle: '0xb023e699f5a33916ea823a16485e259257ca8bd1'
      price_source: '0xf9680d99d6c9589e2a93a78a04a279e509205945'
      minimum_native_balance: '0'
    loan:
      market: loan
      account: fund
      borrow: true
      collateral: false
      minimum_health_factor: '2'
      oracle: '0xb023e699f5a33916ea823a16485e259257ca8bd1'
      price_source: '0x31ebeb03223aac82c8eb24c77624ea40f4d849fb'
      minimum_native_balance: '0'
    trade:
      market: pool
      account: fund
      funding_asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
      trading_asset: eip155:137/erc20:0xc4ce1d6f5d98d65ee25cf85e9f2e9dcfee6cb5d6
      liquidity_enabled: false
      capital:
      - asset: eip155:137/erc20:0xc4ce1d6f5d98d65ee25cf85e9f2e9dcfee6cb5d6
        quantity: '0'
      - asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
        quantity: '2.5'
      entry_swap_bps: 10000
      slippage_bps: 100
      deadline_seconds: 5m
      minimum_native_balance:
        base_units: 0
markets:
  collateral:
    connector: aave_v3
    chain: eip155:137
    asset: eip155:137/erc20:0x7ceb23fd6bc0add59e62ac25578270cff1b9f619
  loan:
    connector: aave_v3
    chain: eip155:137
    asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
  pool:
    connector: curve
    chain: eip155:137
    pool: '0x5225010a0ae133b357861782b0b865a48471b2c5'
accounts:
  fund:
    chain: eip155:137
inventory:
- account: fund
  balance:
    asset: eip155:137/erc20:0x7ceb23fd6bc0add59e62ac25578270cff1b9f619
    quantity: '0.01'
- account: fund
  balance:
    asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
    quantity: '1'
- account: fund
  balance:
    asset: eip155:137/erc20:0xc4ce1d6f5d98d65ee25cf85e9f2e9dcfee6cb5d6
    quantity: '0'
