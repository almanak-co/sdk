# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/uniswap_v4_polygon_lp.fork.yaml.
strategy:
  decision_interval: 60s
  allocations:
    position:
      market: pool
      account: fund
      range:
        lower: 197610
        upper: 198690
      capital:
        asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
        quantity: '5'
      hold_seconds: 300s
      slippage_bps: 100
      deadline_seconds: 300
      minimum_native_balance:
        base_units: 0
      kind: liquidity
      collect_seconds: 3m
markets:
  pool:
    connector: uniswap_v4
    chain: eip155:137
    currency0: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
    currency1: eip155:137/erc20:0x7ceb23fd6bc0add59e62ac25578270cff1b9f619
    fee: 500
    tick_spacing: 10
    hooks: '0x0000000000000000000000000000000000000000'
accounts:
  fund:
    chain: eip155:137
