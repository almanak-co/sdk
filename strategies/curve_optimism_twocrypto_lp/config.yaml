# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/curve_optimism_twocrypto_lp.fork.yaml.
strategy:
  decision_interval: 60s
  allocations:
    proportional:
      market: crypto_pool
      account: proportional
      funding_asset: eip155:10/erc20:0x4200000000000000000000000000000000000006
      trading_asset: eip155:10/erc20:0x10398abc267496e49106b07dd6be13364d10dc71
      liquidity_enabled: true
      capital:
      - asset: eip155:10/erc20:0x10398abc267496e49106b07dd6be13364d10dc71
        quantity: '0'
      - asset: eip155:10/erc20:0x4200000000000000000000000000000000000006
        quantity: '0.0000001'
      entry_swap_bps: 5000
      hold_seconds: 2h
      slippage_bps: 100
      deadline_seconds: 5m
      minimum_native_balance:
        base_units: 0
    single_coin:
      market: crypto_pool
      account: single_coin
      funding_asset: eip155:10/erc20:0x4200000000000000000000000000000000000006
      trading_asset: eip155:10/erc20:0x10398abc267496e49106b07dd6be13364d10dc71
      liquidity_enabled: true
      capital:
      - asset: eip155:10/erc20:0x10398abc267496e49106b07dd6be13364d10dc71
        quantity: '0'
      - asset: eip155:10/erc20:0x4200000000000000000000000000000000000006
        quantity: '0.0000001'
      entry_swap_bps: 5000
      hold_seconds: 2h
      slippage_bps: 100
      deadline_seconds: 5m
      minimum_native_balance:
        base_units: 0
      single_coin_exit: eip155:10/erc20:0x4200000000000000000000000000000000000006
markets:
  crypto_pool:
    connector: curve
    chain: eip155:10
    pool: '0x69cae865bb5efec4990692bdeb2dacaacc77086f'
accounts:
  proportional:
    chain: eip155:10
  single_coin:
    chain: eip155:10
