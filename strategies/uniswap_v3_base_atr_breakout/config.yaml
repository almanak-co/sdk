# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/uniswap_v3_base_atr_breakout.fork.yaml.
strategy:
  decision_interval: 60s
  parameters:
    # Candles whose high-low range sets the midline, excluding the latest.
    channel: 24
    # ATR lookback, in hourly candles.
    atr_period: 14
    # Entries only while ATR is below this fraction of the close.
    max_atr: 0.02
    # Trailing stop distance below the highest close since entry, in ATR.
    stop_atr: 2.5
    # Hourly candles per decision: the channel plus the whole hold, so the highest close
    # since entry stays in the window. hold_seconds must not exceed window - channel hours.
    window: 72
  allocations:
    position:
      market: pool
      account: fund
      capital:
        asset: eip155:8453/erc20:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
        quantity:
          base_units: 100000000
      entry_swap_bps: 10000
      hold_seconds: 2d
      slippage_bps: 100
      deadline_seconds: 300
      minimum_native_balance:
        base_units: 0
  gas:
    # Example Base amounts; size them from the live gas price.
    # Entry takes 2 transactions and exit 2 (almanak check --production):
    # exit_reserve = 2 fees, total_budget = exit_reserve + 2 entry + 20 later fees.
    fund_payer:
      accounts:
      - fund
      chain: eip155:8453
      max_transaction_fee:
        base_units: 75000000000000
      total_budget:
        base_units: 1800000000000000
      exit_reserve:
        base_units: 150000000000000
markets:
  pool:
    connector: uniswap_v3
    chain: eip155:8453
    pool: '0xd0b53d9277642d899df5c87a3966a349a798f224'
accounts:
  fund:
    chain: eip155:8453
