# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/pancakeswap_v3_arbitrum_trading.fork.yaml.
strategy:
  decision_interval: 60s
  allocations:
    position:
      market: pool
      account: fund
      capital:
        asset: eip155:42161/erc20:0x82af49447d8a07e3bd95bd0d56f35241523fbab1
        quantity: '0.1'
      entry_swap_bps: 10000
      hold_seconds: 2h
      slippage_bps: 100
      deadline_seconds: 300
      minimum_native_balance:
        base_units: 0
markets:
  pool:
    connector: pancakeswap_v3
    chain: eip155:42161
    pool: '0xd9e2a1a61b6e61b275cec326465d417e52c1b95c'
accounts:
  fund:
    chain: eip155:42161
