# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/base_compound_borrow_and_trade.fork.yaml.
strategy:
  decision_interval: 60s
  parameters:
    # What the loan allocation borrows, in its asset's units.
    borrow_quantity: '200'
  allocations:
    collateral:
      market: collateral
      account: fund
      capital: '1'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    loan:
      market: loan
      account: fund
      borrow: true
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    trade:
      market: pool
      account: fund
      capital:
        asset: eip155:8453/erc20:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
        quantity:
          base_units: 100000000
      entry_swap_bps: 10000
      slippage_bps: 100
      deadline_seconds: 300
      minimum_native_balance:
        base_units: 0
markets:
  collateral:
    connector: compound_v3
    chain: eip155:8453
    comet: '0xb125e6687d4313864e53df431d5425969c15eb2f'
    asset: eip155:8453/erc20:0x4200000000000000000000000000000000000006
  loan:
    connector: compound_v3
    chain: eip155:8453
    comet: '0xb125e6687d4313864e53df431d5425969c15eb2f'
    asset: eip155:8453/erc20:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
  pool:
    connector: uniswap_v3
    chain: eip155:8453
    pool: '0xd0b53d9277642d899df5c87a3966a349a798f224'
accounts:
  fund:
    chain: eip155:8453
inventory:
- account: fund
  balance:
    asset: eip155:8453/erc20:0x4200000000000000000000000000000000000006
    quantity: '1'
- account: fund
  balance:
    asset: eip155:8453/erc20:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
    quantity: '40'
