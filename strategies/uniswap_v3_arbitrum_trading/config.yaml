# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/uniswap_v3_arbitrum_trading.fork.yaml.
strategy:
  decision_interval: 60s
  allocations:
    position:
      market: pool
      account: fund
      capital:
        asset: eip155:42161/erc20:0xaf88d065e77c8cc2239327c5edb3a432268e5831
        quantity:
          base_units: 100000000
      entry_swap_bps: 10000
      hold_seconds: 300s
      slippage_bps: 100
      deadline_seconds: 300
      minimum_native_balance:
        base_units: 0
  gas:
    # Example Arbitrum amounts; size them from the live gas price.
    # Entry takes 2 transactions and exit 2 (almanak check --production):
    # exit_reserve = 2 fees, total_budget = exit_reserve + 2 entry + 20 later fees.
    fund_payer:
      accounts:
      - fund
      chain: eip155:42161
      max_transaction_fee:
        base_units: 160000000000000
      total_budget:
        base_units: 3840000000000000
      exit_reserve:
        base_units: 320000000000000
markets:
  pool:
    connector: uniswap_v3
    chain: eip155:42161
    pool: '0xc6962004f452be9203591991d15f6b388e09e8d0'
accounts:
  fund:
    chain: eip155:42161
