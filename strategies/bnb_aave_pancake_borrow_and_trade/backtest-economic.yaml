# yaml-language-server: $schema=../../docs/schemas/backtest.schema.json
mode: economic
window:
  start: '2026-09-08T21:00:00+00:00'
  end: '2026-09-08T21:00:30+00:00'
  end_policy: teardown
  cleanup: 60s
inventory:
  funds:
    fund:
      balances:
      - asset: eip155:56/erc20:0xbb4cdb9cbd36b01bd1cbaebf2de08d9173bc095c
        quantity: '0.1'
      - asset: eip155:56/erc20:0x55d398326f99059ff775485246999027b3197955
        quantity: '1'
      - asset: eip155:56/slip44:714
        quantity: '5'
execution:
  latency: 1s
  models:
    aave_v3:
      liquidation_model: immediate_underlying_v3_revision11
    pancakeswap_v3:
      swap_model: prepared_integer_pool
      liquidity_model: null
