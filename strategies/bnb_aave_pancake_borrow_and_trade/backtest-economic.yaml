  connectors:
    aave_v3:
      source: aave_v3_archive
      risk_model: pool_oracle_each_block
      sample_seconds: 60s
      max_age_seconds: 120s
      max_accounting_samples: 10
      max_risk_blocks: 256
      max_risk_samples: 512
      max_liquidations_per_event: 8
    pancakeswap_v3:
      source: pancakeswap_v3_archive
      sample_seconds: 60s
      max_age_seconds: 120s
      max_samples: 10
      max_bitmap_words: 140
      max_initialized_ticks: 1024
      max_liquidity_events: 10000
      max_liquidity_log_requests: 10
      coverage:
      - allocation: trade
        lower: -887272
        upper: 887272
costs:
  aave_v3:
    kind: excluded
  pancakeswap_v3:
    kind: excluded
