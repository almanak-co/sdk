# yaml-language-server: $schema=../../docs/schemas/backtest.schema.json
mode: economic
window:
  start: '2026-09-08T16:28:11+00:00'
  end: '2026-09-08T16:28:41+00:00'
  end_policy: teardown
  cleanup: 60s
inventory:
  funds:
    fund:
      balances:
      - asset: eip155:10/erc20:0x4200000000000000000000000000000000000006
        quantity: '0.01'
      - asset: eip155:10/erc20:0x0b2c639c533813f4aa9d7837caf62653d097ff85
        quantity: '1'
      - asset: eip155:10/slip44:60
        quantity: '5'
execution:
  latency: 1s
  models:
    aave_v3:
      liquidation_model: immediate_underlying_v3_revision11
    uniswap_v4:
      swap_model: prepared_integer_pool
      liquidity_model: null
data:
  connectors:
    aave_v3:
      source: aave_v3_archive
      risk_model: pool_oracle_each_block
      sample_seconds: 60s
      max_age_seconds: 120s
      max_accounting_samples: 10
      max_risk_blocks: 512
      max_risk_samples: 1024
      max_liquidations_per_event: 8
    uniswap_v4:
      sample_seconds: 60s
      max_age_seconds: 72s
      max_samples: 10
      max_bitmap_words: 100
      max_initialized_ticks: 10000
      coverage:
      - allocation: trade
        lower: 180000
        upper: 230000
costs:
  aave_v3:
    kind: excluded
  uniswap_v4:
    kind: excluded
