# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/bnb_morpho_curve_borrow_and_trade.fork.yaml.
strategy:
  decision_interval: 60s
  parameters:
    # What the loan allocation borrows, in its asset's units.
    borrow_quantity: '200'
  allocations:
    earn:
      market: earn
      account: lender
      capital: '1000'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    collateral:
      market: collateral
      account: fund
      capital: '1'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    loan:
      market: loan
      account: fund
      borrow: true
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    trade:
      market: pool
      account: fund
      funding_asset: eip155:56/erc20:0x55d398326f99059ff775485246999027b3197955
      trading_asset: eip155:56/erc20:0xe2fb3f127f5450dee44afe054385d74c392bdef4
      liquidity_enabled: false
      capital:
      - asset: eip155:56/erc20:0xe2fb3f127f5450dee44afe054385d74c392bdef4
        quantity: '0'
      - asset: eip155:56/erc20:0x55d398326f99059ff775485246999027b3197955
        quantity: '0.1'
      entry_swap_bps: 10000
      slippage_bps: 100
      deadline_seconds: 5m
      minimum_native_balance:
        base_units: 0
markets:
  earn:
    connector: morpho_blue
    chain: eip155:56
    market_id: '0x9826776db84a95fef6c8f674b33642e78d86f5ff5b94fbe2f01b76e4e03b328d'
    leg: loan
  collateral:
    connector: morpho_blue
    chain: eip155:56
    market_id: '0x9826776db84a95fef6c8f674b33642e78d86f5ff5b94fbe2f01b76e4e03b328d'
    leg: collateral
  loan:
    connector: morpho_blue
    chain: eip155:56
    market_id: '0x9826776db84a95fef6c8f674b33642e78d86f5ff5b94fbe2f01b76e4e03b328d'
    leg: loan
  pool:
    connector: curve
    chain: eip155:56
    pool: '0xae87e5fa20f335ce14aa3b9e0616308d9ac7d4ce'
accounts:
  lender:
    chain: eip155:56
  fund:
    chain: eip155:56
inventory:
- account: lender
  balance:
    asset: eip155:56/erc20:0x55d398326f99059ff775485246999027b3197955
    quantity: '1000'
- account: fund
  balance:
    asset: eip155:56/erc20:0xbb4cdb9cbd36b01bd1cbaebf2de08d9173bc095c
    quantity: '1'
- account: fund
  balance:
    asset: eip155:56/erc20:0x55d398326f99059ff775485246999027b3197955
    quantity: '20'
- account: fund
  balance:
    asset: eip155:56/erc20:0xe2fb3f127f5450dee44afe054385d74c392bdef4
    quantity: '0'
