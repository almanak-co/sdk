# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/pancakeswap_v3_ethereum_lp.fork.yaml.
strategy:
  decision_interval: 60s
  allocations:
    position:
      market: pool
      account: fund
      range:
        lower: 197630
        upper: 198630
      capital:
        asset: eip155:1/erc20:0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2
        quantity: '0.1'
      entry_swap_bps: 5000
      hold_seconds: 2h
      slippage_bps: 100
      deadline_seconds: 300
      minimum_native_balance:
        base_units: 0
markets:
  pool:
    connector: pancakeswap_v3
    chain: eip155:1
    pool: '0x1ac1a8feaaea1900c4166deeed0c11cc10669d36'
accounts:
  fund:
    chain: eip155:1
