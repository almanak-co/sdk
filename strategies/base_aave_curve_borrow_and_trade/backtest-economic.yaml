# yaml-language-server: $schema=../../docs/schemas/backtest.schema.json
mode: economic
window:
  start: '2026-09-08T02:07:09+00:00'
  end: '2026-09-08T02:07:39+00:00'
  end_policy: teardown
  cleanup: 60s
inventory:
  funds:
    fund:
      balances:
      - asset: eip155:8453/erc20:0x4200000000000000000000000000000000000006
        quantity: '0.01'
      - asset: eip155:8453/erc20:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
        quantity: '1'
      - asset: eip155:8453/erc20:0x417ac0e078398c154edfadd9ef675d30be60af93
        quantity: '0'
