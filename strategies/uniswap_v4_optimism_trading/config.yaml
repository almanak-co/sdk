    chain: eip155:10
    currency0: eip155:10/erc20:0x0b2c639c533813f4aa9d7837caf62653d097ff85
    currency1: eip155:10/erc20:0x4200000000000000000000000000000000000006
    fee: 500
    tick_spacing: 10
