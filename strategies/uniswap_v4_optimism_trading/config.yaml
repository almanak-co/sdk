strategy:
  decision_interval: 60s
  allocations:
    trading:
      market: trading_market
      account: trading
      capital:
        asset: eip155:10/erc20:0x0b2c639c533813f4aa9d7837caf62653d097ff85
        quantity: '10'
      hold_seconds: 43200s
      slippage_bps: 100
      deadline_seconds: 300s
      minimum_native_balance: '0.001'
