# yaml-language-server: $schema=../../docs/schemas/backtest.schema.json
mode: economic
window:
  start: '2026-09-07T09:40:00+00:00'
  end: '2026-09-07T09:40:30+00:00'
  end_policy: teardown
  cleanup: 60s
inventory:
  funds:
    fund:
      balances:
      - asset: eip155:42161/erc20:0x82af49447d8a07e3bd95bd0d56f35241523fbab1
        quantity: '0.01'
      - asset: eip155:42161/erc20:0xaf88d065e77c8cc2239327c5edb3a432268e5831
        quantity: '1'
      - asset: eip155:42161/slip44:60
        quantity: '5'
