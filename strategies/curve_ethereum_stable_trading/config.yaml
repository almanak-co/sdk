# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/curve_ethereum_stable_trading.fork.yaml.
strategy:
  decision_interval: 60s
  allocations:
    trade:
      market: stable_pool
      account: trade
      funding_asset: eip155:1/erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
      trading_asset: eip155:1/erc20:0x4c9edd5852cd905f086c759e8383e09bff1e68b3
      liquidity_enabled: false
      capital:
      - asset: eip155:1/erc20:0x4c9edd5852cd905f086c759e8383e09bff1e68b3
        quantity: '0'
      - asset: eip155:1/erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
        quantity: '100'
      entry_swap_bps: 5000
      hold_seconds: 2h
      slippage_bps: 100
      deadline_seconds: 5m
      minimum_native_balance:
        base_units: 0
  gas:
    # Example Ethereum amounts; size them from the live gas price.
    # Entry takes 1 transaction and exit 2 (almanak check --production):
    # exit_reserve = 2 fees, total_budget = exit_reserve + 1 entry + 20 later fees.
    gas_payer:
      accounts:
      - trade
      chain: eip155:1
      max_transaction_fee:
        base_units: 4100000000000000
      total_budget:
        base_units: 94300000000000000
      exit_reserve:
        base_units: 8200000000000000
markets:
  stable_pool:
    connector: curve
    chain: eip155:1
    pool: '0x02950460e2b9529d0e00284a5fa2d7bdf3fa4d72'
accounts:
  trade:
    chain: eip155:1
