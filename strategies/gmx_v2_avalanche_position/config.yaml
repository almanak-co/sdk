        asset: eip155:43114/erc20:0xb31f66aa3c1e785363f0875a1b74e27b85fd66c7
        quantity: '50'
      entry_collateral:
        asset: eip155:43114/erc20:0xb31f66aa3c1e785363f0875a1b74e27b85fd66c7
        quantity: '20'
      entry_size_usd_e30: 1000000000000000000000000000000000
      execution_fee:
