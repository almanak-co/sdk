# yaml-language-server: $schema=../../docs/schemas/backtest.schema.json
mode: economic
window:
  start: '2026-09-08T08:17:07+00:00'
  end: '2026-09-08T08:17:37+00:00'
  end_policy: teardown
  cleanup: 60s
inventory:
  funds:
    fund:
      balances:
      - asset: eip155:42161/erc20:0x82af49447d8a07e3bd95bd0d56f35241523fbab1
        quantity: '0.05'
      - asset: eip155:42161/erc20:0xaf88d065e77c8cc2239327c5edb3a432268e5831
        quantity: '5'
      - asset: eip155:42161/slip44:60
        quantity: '5'
execution:
  latency: 1s
  models:
    aave_v3:
      liquidation_model: immediate_underlying_v3_revision11
    uniswap_v3:
      swap_model: prepared_integer_pool
      liquidity_model: fixed_historical_fee_growth
data:
  connectors:
    aave_v3:
      source: aave_v3_archive
      risk_model: pool_oracle_each_block
      sample_seconds: 60s
      max_age_seconds: 120s
      max_accounting_samples: 10
      max_risk_blocks: 512
      max_risk_samples: 1024
      max_liquidations_per_event: 8
    uniswap_v3:
      source: uniswap_v3_archive
      sample_seconds: 60s
      max_age_seconds: 72s
      max_samples: 20
      max_bitmap_words: 100
      max_initialized_ticks: 10000
      max_liquidity_events: 10000
      max_liquidity_log_requests: 1000
      coverage:
      - allocation: liquidity
        lower: -200690
        upper: -195690
costs:
  aave_v3:
    kind: excluded
  uniswap_v3:
    kind: excluded
