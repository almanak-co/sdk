# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/arbitrum_aave_borrow_lp.fork.yaml.
strategy:
  decision_interval: 60s
  parameters:
    # Share of the collateral value borrowed once, then provided as liquidity.
    borrow_fraction: '0.3'
    # The unwind starts below this health factor. It must sit above
    # minimum_health_factor: the floor also refuses the unwind's own withdrawals.
    unwind_health_factor: '1.8'
    # With cover_shortfall: the discount on the quoted sale when checking it covers the
    # debt, and the margin collateral released for a shortfall adds beyond it, so the pool
    # fee, price impact and interest leave no repay shortfall.
    swap_headroom_bps: 100
    # Off: teardown repays from the position's proceeds plus the fund's own assets (the
    # loan-asset reserve below joins the position and returns with it), and any rest
    # waits for loan asset sent to the fund. On: a shortfall withdraws and sells
    # collateral through the pool, which then must pair the collateral and loan assets.
    cover_shortfall: false
  allocations:
    collateral:
      market: collateral
      account: fund
      capital: '0.05'
      collateral: true
      # The gateway floor for every borrow and withdrawal, the unwind's included.
      minimum_health_factor: '1.6'
      oracle: '0xb56c2f0b653b2e0b10c9b928c8580ac5df02c7c7'
      price_source: '0xbd41b1548a5a06544cbcf87c0c54864312842c00'
      minimum_native_balance: '0'
    loan:
      market: loan
      account: fund
      borrow: true
      collateral: false
      minimum_health_factor: '1.6'
      oracle: '0xb56c2f0b653b2e0b10c9b928c8580ac5df02c7c7'
      price_source: '0xb0c9a7122aab68f75cffd9851e867144dbff113b'
      minimum_native_balance: '0'
    liquidity:
      market: pool
      account: fund
      # Funded in the borrowed USDC, so closing the position and selling its WETH
      # yields the asset the repay needs.
      band:
        width_bps: 500
      # A slice size for the swap that converts leftover USDC back after an unwind; the
      # opening swap is the band's rebalance swap and uses whatever USDC the fund owns.
      capital:
        asset: eip155:42161/erc20:0xaf88d065e77c8cc2239327c5edb3a432268e5831
        quantity: '1000'
      entry_swap_bps: 10000
      slippage_bps: 100
      deadline_seconds: 300
      minimum_native_balance:
        base_units: 0
  gas:
    # Example Arbitrum amounts; size them from the live gas price.
    # exit_reserve = 10 fees, total_budget = exit_reserve + 6 entry fees (README).
    fund_payer:
      accounts:
      - fund
      chain: eip155:42161
      max_transaction_fee:
        base_units: 150000000000000
      total_budget:
        base_units: 2400000000000000
      exit_reserve:
        base_units: 1500000000000000
markets:
  collateral:
    connector: aave_v3
    chain: eip155:42161
    asset: eip155:42161/erc20:0x82af49447d8a07e3bd95bd0d56f35241523fbab1
  loan:
    connector: aave_v3
    chain: eip155:42161
    asset: eip155:42161/erc20:0xaf88d065e77c8cc2239327c5edb3a432268e5831
  pool:
    connector: uniswap_v3
    chain: eip155:42161
    pool: '0xc6962004f452be9203591991d15f6b388e09e8d0'
accounts:
  fund:
    chain: eip155:42161
inventory:
- account: fund
  balance:
    asset: eip155:42161/erc20:0x82af49447d8a07e3bd95bd0d56f35241523fbab1
    quantity: '0.05'
# The loan-asset reserve: the user's own USDC, so swap fees and accrued interest leave
# no repay shortfall without selling collateral. It joins the position at entry.
- account: fund
  balance:
    asset: eip155:42161/erc20:0xaf88d065e77c8cc2239327c5edb3a432268e5831
    quantity: '5'
