# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/morpho_blue_bnb_lending.fork.yaml.
strategy:
  decision_interval: 60s
  parameters:
    # What the loan allocation borrows, in its asset's units.
    borrow_quantity: '200'
  allocations:
    earn:
      market: earn
      account: lender
      capital: '1000'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    collateral:
      market: collateral
      account: borrower
      capital: '1'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    loan:
      market: loan
      account: borrower
      borrow: true
      minimum_health_factor: '2'
      minimum_native_balance: '0'
markets:
  earn:
    connector: morpho_blue
    chain: eip155:56
    market_id: '0x9826776db84a95fef6c8f674b33642e78d86f5ff5b94fbe2f01b76e4e03b328d'
    leg: loan
  collateral:
    connector: morpho_blue
    chain: eip155:56
    market_id: '0x9826776db84a95fef6c8f674b33642e78d86f5ff5b94fbe2f01b76e4e03b328d'
    leg: collateral
  loan:
    connector: morpho_blue
    chain: eip155:56
    market_id: '0x9826776db84a95fef6c8f674b33642e78d86f5ff5b94fbe2f01b76e4e03b328d'
    leg: loan
accounts:
  lender:
    chain: eip155:56
  borrower:
    chain: eip155:56
