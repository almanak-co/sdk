# yaml-language-server: $schema=../../docs/schemas/backtest.schema.json
mode: economic
window:
  start: '2026-09-07T09:40:00+00:00'
  end: '2026-09-07T09:40:30+00:00'
  end_policy: teardown
  cleanup: 60s
inventory:
  funds:
    fund:
      balances:
      - asset: eip155:1/erc20:0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2
        quantity: '0.01'
      - asset: eip155:1/erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
        quantity: '1'
      - asset: eip155:1/slip44:60
        quantity: '5'
execution:
  latency: 1s
  models:
    aave_v3:
      liquidation_model: immediate_underlying_v3_revision11
    pancakeswap_v3:
      swap_model: prepared_integer_pool
      liquidity_model: null
data:
  connectors:
    aave_v3:
      source: aave_v3_archive
      risk_model: pool_oracle_each_block
      sample_seconds: 60s
      max_age_seconds: 120s
      max_accounting_samples: 10
      max_risk_blocks: 256
      max_risk_samples: 512
      max_liquidations_per_event: 8
    pancakeswap_v3:
      source: pancakeswap_v3_archive
      sample_seconds: 60s
      max_age_seconds: 120s
      max_samples: 10
      max_bitmap_words: 700
      max_initialized_ticks: 8192
      max_liquidity_events: 10000
      max_liquidity_log_requests: 10
      coverage:
      - allocation: trade
        lower: -887272
        upper: 887272
costs:
  aave_v3:
    kind: excluded
  pancakeswap_v3:
    kind: excluded
