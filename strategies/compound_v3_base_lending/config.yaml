# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/compound_v3_base_lending.fork.yaml.
strategy:
  decision_interval: 60s
  parameters:
    # What the loan allocation borrows, in its asset's units.
    borrow_quantity: '200'
  allocations:
    earn:
      market: earn
      account: lender
      capital: '1000'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    collateral:
      market: collateral
      account: borrower
      capital: '1'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    loan:
      market: loan
      account: borrower
      borrow: true
      minimum_health_factor: '2'
      minimum_native_balance: '0'
  gas:
    # Example Base amounts; size them from the live gas price.
    # Entry takes 3 transactions and exit 5 (almanak check --production):
    # exit_reserve = 5 fees, total_budget = exit_reserve + 3 entry + 20 later fees.
    gas_payer:
      accounts:
      - lender
      - borrower
      chain: eip155:8453
      max_transaction_fee:
        base_units: 75000000000000
      total_budget:
        base_units: 2100000000000000
      exit_reserve:
        base_units: 375000000000000
markets:
  earn:
    connector: compound_v3
    chain: eip155:8453
    comet: '0xb125e6687d4313864e53df431d5425969c15eb2f'
    asset: eip155:8453/erc20:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
  collateral:
    connector: compound_v3
    chain: eip155:8453
    comet: '0xb125e6687d4313864e53df431d5425969c15eb2f'
    asset: eip155:8453/erc20:0x4200000000000000000000000000000000000006
  loan:
    connector: compound_v3
    chain: eip155:8453
    comet: '0xb125e6687d4313864e53df431d5425969c15eb2f'
    asset: eip155:8453/erc20:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
accounts:
  lender:
    chain: eip155:8453
  borrower:
    chain: eip155:8453
