# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/morpho_blue_polygon_lending.fork.yaml.
strategy:
  decision_interval: 60s
  parameters:
    # What the loan allocation borrows, in its asset's units.
    borrow_quantity: '200'
  allocations:
    earn:
      market: earn
      account: lender
      capital: '1000'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    collateral:
      market: collateral
      account: borrower
      capital: '1'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    loan:
      market: loan
      account: borrower
      borrow: true
      minimum_health_factor: '2'
      minimum_native_balance: '0'
markets:
  earn:
    connector: morpho_blue
    chain: eip155:137
    market_id: '0xa5b7ae7654d5041c28cb621ee93397394c7aee6c6e16c7e0fd030128d87ee1a3'
    leg: loan
  collateral:
    connector: morpho_blue
    chain: eip155:137
    market_id: '0xa5b7ae7654d5041c28cb621ee93397394c7aee6c6e16c7e0fd030128d87ee1a3'
    leg: collateral
  loan:
    connector: morpho_blue
    chain: eip155:137
    market_id: '0xa5b7ae7654d5041c28cb621ee93397394c7aee6c6e16c7e0fd030128d87ee1a3'
    leg: loan
accounts:
  lender:
    chain: eip155:137
  borrower:
    chain: eip155:137
