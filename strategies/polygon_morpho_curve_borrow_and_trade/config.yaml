# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/polygon_morpho_curve_borrow_and_trade.fork.yaml.
strategy:
  decision_interval: 60s
  parameters:
    # What the loan allocation borrows, in its asset's units.
    borrow_quantity: '5'
  allocations:
    collateral:
      market: collateral
      account: fund
      capital: '0.01'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    loan:
      market: loan
      account: fund
      borrow: true
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    trade:
      market: pool
      account: fund
      funding_asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
      trading_asset: eip155:137/erc20:0xc4ce1d6f5d98d65ee25cf85e9f2e9dcfee6cb5d6
      liquidity_enabled: false
      capital:
      - asset: eip155:137/erc20:0xc4ce1d6f5d98d65ee25cf85e9f2e9dcfee6cb5d6
        quantity: '0'
      - asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
        quantity: '2.5'
      entry_swap_bps: 10000
      slippage_bps: 100
      deadline_seconds: 5m
      minimum_native_balance:
        base_units: 0
markets:
  collateral:
    connector: morpho_blue
    chain: eip155:137
    market_id: '0xa5b7ae7654d5041c28cb621ee93397394c7aee6c6e16c7e0fd030128d87ee1a3'
    leg: collateral
  loan:
    connector: morpho_blue
    chain: eip155:137
    market_id: '0xa5b7ae7654d5041c28cb621ee93397394c7aee6c6e16c7e0fd030128d87ee1a3'
    leg: loan
  pool:
    connector: curve
    chain: eip155:137
    pool: '0x5225010a0ae133b357861782b0b865a48471b2c5'
accounts:
  fund:
    chain: eip155:137
inventory:
- account: fund
  balance:
    asset: eip155:137/erc20:0x7ceb23fd6bc0add59e62ac25578270cff1b9f619
    quantity: '0.01'
- account: fund
  balance:
    asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
    quantity: '2'
- account: fund
  balance:
    asset: eip155:137/erc20:0xc4ce1d6f5d98d65ee25cf85e9f2e9dcfee6cb5d6
    quantity: '0'
