# yaml-language-server: $schema=../../docs/schemas/backtest.schema.json
mode: economic
window:
  start: '2026-09-07T20:00:00+00:00'
  end: '2026-09-07T20:00:30+00:00'
  end_policy: teardown
  cleanup: 60s
inventory:
  funds:
    fund:
      balances:
      - asset: eip155:137/erc20:0x7ceb23fd6bc0add59e62ac25578270cff1b9f619
        quantity: '0.01'
      - asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
        quantity: '2'
      - asset: eip155:137/erc20:0xc4ce1d6f5d98d65ee25cf85e9f2e9dcfee6cb5d6
        quantity: '0'
      - asset: eip155:137/slip44:966
        quantity: '10'
execution:
  latency: 1s
  models:
    morpho_blue:
      liquidation_model: immediate_morpho_liquidation
    curve:
      swap_model: prepared_integer_pool
      liquidity_model: null
data:
  connectors:
    morpho_blue:
      source: morpho_blue_archive
      risk_model: morpho_oracle_each_block
      sample_seconds: 30s
      max_age_seconds: 60s
      max_accounting_samples: 10
      max_risk_blocks: 128
      max_risk_samples: 128
      max_liquidations_per_event: 8
    curve:
      source: curve_archive
      sample_seconds: 60s
      max_age_seconds: 120s
      max_samples: 100
      max_parameter_events: 100
      max_parameter_log_requests: 10
costs:
  morpho_blue:
    kind: excluded
  curve:
    kind: excluded
