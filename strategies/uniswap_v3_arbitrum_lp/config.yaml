# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only, including the production gas policy. Providers, account
# bindings and the fork fixture are operator inputs:
# examples/operators/uniswap_v3_arbitrum_lp.fork.yaml and
# examples/operators/uniswap_v3_arbitrum_lp.production.yaml.
strategy:
  decision_interval: 60s
  allocations:
    position:
      market: pool
      account: fund
      range:
        lower: -198690
        upper: -197690
      capital:
        asset: eip155:42161/erc20:0xaf88d065e77c8cc2239327c5edb3a432268e5831
        quantity:
          base_units: 100000000
      entry_swap_bps: 5000
      hold_seconds: 300s
      slippage_bps: 100
      deadline_seconds: 300
      minimum_native_balance:
        base_units: 0
  gas:
    # Arbitrum One values; gas ceilings are chain-specific, never copy them to another chain.
    # max_transaction_fee >= max_gas_limit x max_gas_price_wei;
    # exit_reserve >= 5 exit fees; total_budget >= 4 entry fees + exit_reserve.
    # Above max_gas_price_wei every transaction, exits included, waits for gas to fall;
    # nothing is lost.
    # Nitro refunds a legacy bid down to the charged price, so a 1.25x base fee
    # multiplier keeps the bid above the slow-moving base fee without eating the ceiling.
    fund_payer:
      accounts:
      - fund
      chain: eip155:42161
      source: network_rpc_fee_history
      reward_percentile: 50
      base_fee_multiplier_bps: 12500
      max_gas_price_wei: 150000000
      max_gas_limit: 1000000
      gas_limit_buffer_bps: 2500
      max_transaction_fee:
        base_units: 150000000000000
      total_budget:
        base_units: 1400000000000000
      exit_reserve:
        base_units: 750000000000000
markets:
  pool:
    connector: uniswap_v3
    chain: eip155:42161
    pool: '0xc6962004f452be9203591991d15f6b388e09e8d0'
accounts:
  fund:
    chain: eip155:42161
