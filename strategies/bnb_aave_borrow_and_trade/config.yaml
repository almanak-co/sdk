# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/bnb_aave_borrow_and_trade.fork.yaml.
strategy:
  decision_interval: 60s
  parameters:
    # What the loan allocation borrows, in its asset's units.
    borrow_quantity: '5'
  allocations:
    collateral:
      market: collateral
      account: fund
      capital: '0.1'
      collateral: true
      minimum_health_factor: '2'
      oracle: '0x39bc1bfda2130d6bb6dbefd366939b4c7aa7c697'
      price_source: '0x0567f2323251f0aab15c8dfb1967e4e8a7d42aee'
      minimum_native_balance: '0'
    loan:
      market: loan
      account: fund
      borrow: true
      collateral: false
      minimum_health_factor: '2'
      oracle: '0x39bc1bfda2130d6bb6dbefd366939b4c7aa7c697'
      price_source: '0xee845a7a40a090da256420a293803c35b7f436b6'
      minimum_native_balance: '0'
    trade:
      market: pool
      account: fund
      funding_asset: eip155:56/erc20:0x55d398326f99059ff775485246999027b3197955
      trading_asset: eip155:56/erc20:0xe2fb3f127f5450dee44afe054385d74c392bdef4
      liquidity_enabled: false
      capital:
      - asset: eip155:56/erc20:0xe2fb3f127f5450dee44afe054385d74c392bdef4
        quantity: '0'
      - asset: eip155:56/erc20:0x55d398326f99059ff775485246999027b3197955
        quantity: '2.5'
      entry_swap_bps: 10000
      slippage_bps: 100
      deadline_seconds: 5m
      minimum_native_balance:
        base_units: 0
markets:
  collateral:
    connector: aave_v3
    chain: eip155:56
    asset: eip155:56/erc20:0xbb4cdb9cbd36b01bd1cbaebf2de08d9173bc095c
  loan:
    connector: aave_v3
    chain: eip155:56
    asset: eip155:56/erc20:0x55d398326f99059ff775485246999027b3197955
  pool:
    connector: curve
    chain: eip155:56
    pool: '0xae87e5fa20f335ce14aa3b9e0616308d9ac7d4ce'
accounts:
  fund:
    chain: eip155:56
inventory:
- account: fund
  balance:
    asset: eip155:56/erc20:0xbb4cdb9cbd36b01bd1cbaebf2de08d9173bc095c
    quantity: '0.1'
- account: fund
  balance:
    asset: eip155:56/erc20:0x55d398326f99059ff775485246999027b3197955
    quantity: '1'
- account: fund
  balance:
    asset: eip155:56/erc20:0xe2fb3f127f5450dee44afe054385d74c392bdef4
    quantity: '0'
