# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/aave_v3_arbitrum_managed_borrow.fork.yaml.
strategy:
  decision_interval: 60s
  parameters:
    # Health factors the strategy steers by. Below repay_health_factor it repays to
    # target_health_factor; above borrow_health_factor (or with no debt) it borrows to
    # it. repay_health_factor must sit above minimum_health_factor, the gateway floor.
    repay_health_factor: '1.9'
    target_health_factor: '2.2'
    borrow_health_factor: '2.6'
  allocations:
    collateral:
      market: collateral
      account: fund
      capital: '0.05'
      collateral: true
      minimum_health_factor: '1.6'
      oracle: '0xb56c2f0b653b2e0b10c9b928c8580ac5df02c7c7'
      price_source: '0xbd41b1548a5a06544cbcf87c0c54864312842c00'
      minimum_native_balance: '0'
    loan:
      market: loan
      account: fund
      # A loan-asset reserve, never supplied or spent, for the full repay's interest.
      capital: '1'
      borrow: true
      collateral: false
      minimum_health_factor: '1.6'
      oracle: '0xb56c2f0b653b2e0b10c9b928c8580ac5df02c7c7'
      price_source: '0xb0c9a7122aab68f75cffd9851e867144dbff113b'
      minimum_native_balance: '0'
  gas:
    # Example Arbitrum amounts; size them from the live gas price. exit_reserve = 4 fees,
    # total_budget = exit_reserve + 6 entry fees + 20 band adjustments (README).
    fund_payer:
      accounts:
      - fund
      chain: eip155:42161
      max_transaction_fee:
        base_units: 150000000000000
      total_budget:
        base_units: 4500000000000000
      exit_reserve:
        base_units: 600000000000000
markets:
  collateral:
    connector: aave_v3
    chain: eip155:42161
    asset: eip155:42161/erc20:0x82af49447d8a07e3bd95bd0d56f35241523fbab1
  loan:
    connector: aave_v3
    chain: eip155:42161
    asset: eip155:42161/erc20:0xaf88d065e77c8cc2239327c5edb3a432268e5831
accounts:
  fund:
    chain: eip155:42161
