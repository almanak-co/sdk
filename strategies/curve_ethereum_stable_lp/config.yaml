# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/curve_ethereum_stable_lp.fork.yaml.
strategy:
  decision_interval: 60s
  allocations:
    proportional:
      market: stable_pool
      account: proportional
      funding_asset: eip155:1/erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
      trading_asset: eip155:1/erc20:0x4c9edd5852cd905f086c759e8383e09bff1e68b3
      liquidity_enabled: true
      capital:
      - asset: eip155:1/erc20:0x4c9edd5852cd905f086c759e8383e09bff1e68b3
        quantity: '0'
      - asset: eip155:1/erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
        quantity: '100'
      entry_swap_bps: 5000
      hold_seconds: 2h
      slippage_bps: 100
      deadline_seconds: 5m
      minimum_native_balance:
        base_units: 0
    single_coin:
      market: stable_pool
      account: single_coin
      funding_asset: eip155:1/erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
      trading_asset: eip155:1/erc20:0x4c9edd5852cd905f086c759e8383e09bff1e68b3
      liquidity_enabled: true
      capital:
      - asset: eip155:1/erc20:0x4c9edd5852cd905f086c759e8383e09bff1e68b3
        quantity: '0'
      - asset: eip155:1/erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
        quantity: '100'
      entry_swap_bps: 5000
      hold_seconds: 2h
      slippage_bps: 100
      deadline_seconds: 5m
      minimum_native_balance:
        base_units: 0
      single_coin_exit: eip155:1/erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
markets:
  stable_pool:
    connector: curve
    chain: eip155:1
    pool: '0x02950460e2b9529d0e00284a5fa2d7bdf3fa4d72'
accounts:
  proportional:
    chain: eip155:1
  single_coin:
    chain: eip155:1
