# yaml-language-server: $schema=../../docs/schemas/strategy.schema.json
# Author choices only. Providers, account bindings and the fork fixture are
# operator inputs: examples/operators/morpho_blue_avalanche_lending.fork.yaml.
strategy:
  decision_interval: 60s
  parameters:
    # What the loan allocation borrows, in its asset's units.
    borrow_quantity: '0.1'
  allocations:
    earn:
      market: earn
      account: lender
      capital: '1'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    collateral:
      market: collateral
      account: borrower
      capital: '1'
      minimum_health_factor: '2'
      minimum_native_balance: '0'
    loan:
      market: loan
      account: borrower
      borrow: true
      minimum_health_factor: '2'
      minimum_native_balance: '0'
markets:
  earn:
    connector: morpho_blue
    chain: eip155:43114
    market_id: '0x2358f128789e67e053f9b9082cfbe4c0ceca8c51fa67c72f3a395e140b96607b'
    leg: loan
  collateral:
    connector: morpho_blue
    chain: eip155:43114
    market_id: '0x2358f128789e67e053f9b9082cfbe4c0ceca8c51fa67c72f3a395e140b96607b'
    leg: collateral
  loan:
    connector: morpho_blue
    chain: eip155:43114
    market_id: '0x2358f128789e67e053f9b9082cfbe4c0ceca8c51fa67c72f3a395e140b96607b'
    leg: loan
accounts:
  lender:
    chain: eip155:43114
  borrower:
    chain: eip155:43114
