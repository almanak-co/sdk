# Separate config for llms.txt generation (no i18n).
#
# mkdocs-llmstxt is incompatible with mkdocs-static-i18n: the i18n plugin
# rebuilds the site per locale and resets the llmstxt state each time.
# Usage: uv run mkdocs build -f mkdocs-llms.yml (wired as `make docs-llms`).
INHERIT: mkdocs.yml

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Overview:
          - index.md
          - how-it-works.md
        Learn:
          - getting-started.md
        Build:
          - authoring.md
          - dashboards.md
          - configuration.md
          - backtesting.md
          - examples.md
          - support.md
        Operate:
          - operating.md
          - agents.md
        Additional Guides:
          - code.md
          - qa.md
        CLI Reference:
          - cli/*.md
        API Reference:
          - api/*.md
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
