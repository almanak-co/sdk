name: Main

on:
  push:
    branches:
      - main

# Runs the gates on every merge; nothing is published from main.
permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/template_lint.yml

  typecheck:
    uses: ./.github/workflows/template_typecheck.yml

  test_linux:
    uses: ./.github/workflows/template_platform_test.yml
    with:
      os: ubuntu-22.04

  test_macos:
    uses: ./.github/workflows/template_platform_test.yml
    with:
      os: macos-15
      advisory: true

  test_strat:
    uses: ./.github/workflows/template_strat_test.yml

  test_suite:
    uses: ./.github/workflows/template_test_suite.yml
    with:
      # No CRAP gate runs on main, so the shard coverage has no consumer.
      coverage: false

  docs:
    uses: ./.github/workflows/template_docs.yml
