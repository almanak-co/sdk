name: Test Pytest

on:
  workflow_call:
    inputs:
      skip:
        description: "Skip the pytest run (no-op success, used by path-based filtering)."
        type: boolean
        required: false
        default: false
      coverage:
        description: >-
          Record shard coverage for the CRAP gate. The PR crap_gate job is the
          only consumer of the combined data, so callers that never score CRAP
          (main, release flows) can run the suite without tracing overhead.
        type: boolean
        required: false
        default: true

# The offline suite spawns sandboxed workers and needs over an hour on one
# hosted 2-core runner, so it is split across shards. Each shard records
# coverage under the CRAP configuration; the aggregator combines the data for
# the CRAP gate and is the required check `test_pytest / test`.
jobs:
  shard:
    name: "unit shard ${{ matrix.group }}"
    if: ${{ !inputs.skip }}
    # The org's 8-core larger runner;
    # `-n auto` gives every shard 8 xdist workers instead of 2.
    runs-on: ubuntu-latest-l
    permissions:
      contents: read
    # Shards measure 6-10 minutes end to end with coverage on; the limit is
    # hang protection with ample headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # --splits reads strategy.job-total, so this list is the only tuning knob.
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-repo
        with:
          install-bwrap: "true"

      # Tests that read retained captures use the copies committed under tests/fixtures/evidence/,
      # pinned in tests/fixtures/evidence.json; a missing or changed copy fails the shard
      # instead of skipping its tests.
      - name: Verify pinned evidence copies
        run: make fixtures

      - name: Run test shard
        run: bash scripts/ci/run_pytest_shard.sh "${{ strategy.job-total }}" "${{ matrix.group }}" "${{ inputs.coverage }}"

      - name: Upload shard artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-shard-${{ matrix.group }}
          # A re-run shard must replace its stale artifact, not sit beside it:
          # downloads by name resolve the oldest same-named artifact in the run.
          overwrite: true
          path: |
            .coverage.shard-${{ matrix.group }}
            coverage.shard-${{ matrix.group }}.sources.json
            test-results-${{ matrix.group }}.xml
            pytest-${{ matrix.group }}.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  # Job id stays `test` so the required check context is `test_pytest / test`.
  # `if: always()` so the skip path and a failed shard matrix both report here.
  test:
    needs: [shard]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Skip notice
        if: ${{ inputs.skip }}
        run: echo "Skipping pytest; no relevant file changes detected by the path filter."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ !inputs.skip }}
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-repo
        if: ${{ !inputs.skip }}

      - name: Download shard artifacts
        if: ${{ !inputs.skip }}
        uses: actions/download-artifact@v8
        with:
          pattern: pytest-shard-*
          merge-multiple: true

      # Runs before the gate so a failing run still names its failed tests.
      - name: Report verification scope
        if: ${{ !inputs.skip && always() }}
        run: |
          {
            echo '## Offline tests with evidence-dependent cases skipped'
            echo
            echo "Shard logs: $(ls pytest-*.log 2>/dev/null | wc -l) on ${RUNNER_OS}."
            echo
            grep -h '^evidence-skips:' pytest-*.log | sort | uniq -c || echo 'evidence-skips: line not found; a shard did not reach its summary.'
            echo
            grep -hE '^(=+ .*(passed|failed|error).* =+)$' pytest-*.log || true
            echo
            grep -hE '^(FAILED|ERROR) ' pytest-*.log || true
            echo
            echo 'Retained evidence under `docs/internal/reports/evidence/` is local only; tests pinned in `tests/fixtures/evidence.json` ran from the committed copies under `tests/fixtures/evidence/`. Skipped cases are not passes. Fork lifecycles and full QA run locally (docs/qa.md).'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Evidence-dependent tests are skipped in hosted CI; this job does not establish full QA success."

      - name: Gate on shard results
        if: ${{ !inputs.skip }}
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::unit shards finished with result '$SHARD_RESULT'"
            exit 1
          fi

      - name: Combine shard coverage
        if: ${{ !inputs.skip && inputs.coverage }}
        run: |
          ls .coverage.shard-* test-results-*.xml
          uv run --locked coverage combine --keep --data-file=.coverage .coverage.shard-*
          test -s .coverage

      # The refreshed file is the balancing input for future runs; commit it
      # from a coverage-on (PR) run so the weights match PR shard conditions.
      - name: Merge shard durations
        if: ${{ !inputs.skip && inputs.coverage }}
        run: uv run --locked python scripts/ci/merge_test_durations.py .test_durations.new .

      - name: Upload merged test durations
        if: ${{ !inputs.skip && inputs.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: test-durations
          path: .test_durations.new
          if-no-files-found: error
          # The dot-prefixed file is otherwise silently excluded.
          include-hidden-files: true
          retention-days: 30

      - name: Upload combined coverage and results
        # The CRAP gate downloads `pytest-coverage` and scores `.coverage`.
        if: ${{ !inputs.skip && inputs.coverage && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-coverage
          overwrite: true
          path: |
            .coverage
            coverage.shard-*.sources.json
            test-results-*.xml
            pytest-*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
