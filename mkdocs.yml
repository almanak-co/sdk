site_name: Almanak SDK
site_description: Python SDK for writing, checking, running and backtesting autonomous DeFi strategies
site_url: https://docs.almanak.co
repo_url: https://github.com/almanak-co/sdk
repo_name: almanak-co/sdk
use_directory_urls: false

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo-icon.svg
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - autorefs:
      resolve_closest: true
  # Suffix structure: a translated page is `page.<locale>.md` next to the English
  # page. Locales other than English are declared but not built until their
  # first translation lands; flip `build` and add the locale to `extra.alternate`.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: false
          nav_translations:
            Home: 首页
            Getting Started: 快速入门
            CLI Reference: CLI 参考
            API Reference: API 参考
        - locale: fr
          name: Français
          build: false
          nav_translations:
            Home: Accueil
            Getting Started: Premiers pas
            CLI Reference: Référence CLI
            API Reference: Référence API
        - locale: es
          name: Español
          build: false
          nav_translations:
            Home: Inicio
            Getting Started: Primeros pasos
            CLI Reference: Referencia CLI
            API Reference: Referencia API
  # The llmstxt plugin lives in mkdocs-llms.yml; it cannot run under i18n.
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            show_root_heading: true
            show_source: false
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true

extra:
  generator: false
  homepage: /
  alternate:
    - name: English
      link: /
      lang: en

extra_css:
  - stylesheets/extra.css

validation:
  nav:
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

exclude_docs: |
  internal/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - def_list
  - tables

nav:
  - Home: index.md
  - Learn:
    - How the SDK Works: how-it-works.md
    - Getting Started: getting-started.md
  - Build:
    - Strategy Authoring: authoring.md
    - Dashboards: dashboards.md
    - Configuration: configuration.md
    - Backtesting: backtesting.md
    - Example Strategies: examples.md
  - Operate:
    - Operating: operating.md
    - Agents: agents.md
  - Reference:
    - Supported Connectors: support.md
    - CLI:
      - cli/almanak.md
      - Check: cli/almanak-check.md
      - Run: cli/almanak-run.md
      - Lifecycle: cli/almanak-lifecycle.md
      - Report: cli/almanak-report.md
      - Support: cli/almanak-support.md
      - Backtest: cli/almanak-backtest.md
      - Services: cli/almanak-service.md
      - Permissions: cli/almanak-permissions.md
      - Wallets: cli/almanak-wallet.md
      - Read-only Observations: cli/almanak-ax.md
    - Python API:
      - Authoring API: api/authoring.md
      - Strategy State: api/strategy.md
      - Intents: api/intents.md
      - Connector Support: api/connectors.md
      - Configuration: api/configuration.md
      - Reports: api/reports.md
      - Schemas: api/schemas.md
      - Architecture Contracts: api/index.md
    - Almanak Code Status: code.md
    - Daily QA: qa.md
