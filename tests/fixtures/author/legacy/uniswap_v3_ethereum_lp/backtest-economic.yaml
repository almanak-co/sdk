# yaml-language-server: $schema=../../docs/schemas/backtest.schema.json
mode: economic
window:
  start: '2026-09-06T19:57:23+00:00'
  end: '2026-09-06T22:57:23+00:00'
  end_policy: teardown
  cleanup: 600s
inventory:
  funds:
    fund:
      balances:
      - asset: eip155:1/erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
        quantity: '100'
      - asset: eip155:1/erc20:0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2
        quantity: '0'
      - asset: eip155:1/slip44:60
        quantity: '1'
execution:
  latency: 5s
  models:
    swap_model: prepared_integer_pool
    liquidity_model: fixed_historical_fee_growth
data:
  history:
  - chain:
      chain_id: eip155:1
      environment: mainnet
    provider:
      kind: alchemy
      network: eth-mainnet
      api_key_env: ALCHEMY_API_KEY
  source: uniswap_v3_archive
  sample_seconds: 60s
  max_age_seconds: 72s
  max_samples: 200
  max_bitmap_words: 100
  max_initialized_ticks: 10000
  max_liquidity_events: 10000
  max_liquidity_log_requests: 1000
  coverage:
  - allocation: position
    lower: 195520
    upper: 200520
costs:
  kind: excluded
