# yaml-language-server: $schema=../../docs/schemas/backtest.schema.json
mode: economic
window:
  start: '2026-09-07T10:00:00+00:00'
  end: '2026-09-07T10:08:00+00:00'
  end_policy: teardown
  cleanup: 60s
inventory:
  funds:
    fund:
      balances:
      - asset: eip155:8453/erc20:0x4200000000000000000000000000000000000006
        quantity: '0.1'
      - asset: eip155:8453/erc20:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
        quantity: '0'
      - asset: eip155:8453/slip44:60
        quantity: '0'
execution:
  latency: 1s
  models:
    swap_model: prepared_integer_pool
    liquidity_model: fixed_historical_fee_growth
data:
  history:
  - chain:
      chain_id: eip155:8453
      environment: mainnet
    provider:
      api_key_env: ALCHEMY_API_KEY
      kind: alchemy
      network: base-mainnet
  source: aerodrome_slipstream_archive
  sample_seconds: 60s
  max_age_seconds: 120s
  max_samples: 10
  max_bitmap_words: 700
  max_initialized_ticks: 8192
  max_liquidity_events: 10000
  max_liquidity_log_requests: 10
  coverage:
  - allocation: position
    lower: -887272
    upper: 887272
costs:
  kind: excluded
