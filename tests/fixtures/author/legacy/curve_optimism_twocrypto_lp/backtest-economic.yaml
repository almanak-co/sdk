mode: economic
window:
  start: '2026-09-07T20:00:00+00:00'
  end: '2026-09-07T20:08:00+00:00'
  end_policy: teardown
  cleanup: 60s
execution:
  latency: 1s
  models:
    swap_model: prepared_integer_pool
    liquidity_model: fixed_external_unit_balances
inventory:
