    proportional:
      balances:
      - asset: eip155:10/erc20:0x4200000000000000000000000000000000000006
        quantity: '0.0000001'
      - asset: eip155:10/erc20:0x10398abc267496e49106b07dd6be13364d10dc71
        quantity: '0'
      - asset: eip155:10/slip44:60
        quantity: '0'
    single_coin:
      balances:
      - asset: eip155:10/erc20:0x4200000000000000000000000000000000000006
        quantity: '0.0000001'
      - asset: eip155:10/erc20:0x10398abc267496e49106b07dd6be13364d10dc71
        quantity: '0'
      - asset: eip155:10/slip44:60
        quantity: '0'
costs:
  kind: excluded
data:
  source: curve_archive
  sample_seconds: 60s
  max_age_seconds: 120s
  max_samples: 100
  max_parameter_events: 100
  max_parameter_log_requests: 10
  history:
  - chain:
      chain_id: eip155:10
      environment: mainnet
    provider:
      kind: alchemy
      network: opt-mainnet
      api_key_env: ALCHEMY_API_KEY
