# Identified fork fixture for the production example's treasury account. This
# only supplies public Foundry authority and cannot authorize a mainnet run.
schema_version: operator-gateway-config-v1
modes: [fork]
networks:
- chain: eip155:1
  provider: {kind: alchemy, api_key_env: ALCHEMY_API_KEY}
accounts:
  bindings:
  - name: treasury
    profile:
      kind: eoa
      fund:
        chain: {chain_id: eip155:1, environment: mainnet}
        address: '0x0000000000000000000000000000000000000001'
fork:
  anchors:
  - chain: eip155:1
    height: 25908472
    reference: '0xebd2f4a6612e094a8db8d1ab770970f7060bdaf3a18a49e4274f8935d5348ea0'
  funds:
  - kind: safe_roles
    account: treasury
    operator: operator_shared
    assets:
    - asset: eip155:1/erc20:0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2
      amount: 40000000000000000
    - asset: eip155:1/erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
      amount: 1000000
  operators:
  - name: operator_shared
    native_balance:
      asset: eip155:1/slip44:60
      amount: 5000000000000000000
  gas:
  - accounts: [treasury]
    max_gas_price_wei: 5000000000
    max_gas_limit: 1000000
    max_transaction_fee:
      asset: eip155:1/slip44:60
      amount: 5000000000000000
    total_budget:
      asset: eip155:1/slip44:60
      amount: 30000000000000000
    allow_replacement: false
