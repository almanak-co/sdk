mode: economic
window:
  start: '2026-09-07T15:00:00Z'
  end: '2026-09-07T15:00:30Z'
  end_policy: teardown
  cleanup: 60s
inventory:
  funds:
    fund:
      balances:
      - asset: eip155:43114/erc20:0xa25eaf2906fa1a3a13edac9b9657108af7b703e3
        quantity: '1'
      - asset: eip155:43114/erc20:0xb31f66aa3c1e785363f0875a1b74e27b85fd66c7
