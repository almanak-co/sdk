      max_accounting_samples: 10
      max_risk_blocks: 512
      max_risk_samples: 512
      max_liquidations_per_event: 8
    uniswap_v4:
      sample_seconds: 60s
      max_age_seconds: 72s
      max_samples: 10
      max_bitmap_words: 16
      max_initialized_ticks: 2048
      coverage:
      - allocation: trade
        lower: -265000
        upper: -245000
costs:
  morpho_blue:
    kind: excluded
  uniswap_v4:
    kind: excluded
