# Operator execution context for a fork run of strategies/uniswap_v4_ethereum_native_trading.
# Provider credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:1
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: trading
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:1
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
fork:
  anchors:
  - chain: eip155:1
    height: 26184622
    reference: '0x914a458c8cb5bf26aa2d49d5d01197213038588674f141fa0ce78515e97ad45e'
  funds:
  - kind: safe_roles
    account: trading
    operator: operator
    assets:
    - asset: eip155:1/erc20:0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2
      amount: 50500000000000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:1/slip44:60
      amount: 1000000000000000000
  gas:
  - accounts:
    - trading
    max_gas_price_wei: 3416666666
    max_gas_limit: 1200000
    max_transaction_fee:
      asset: eip155:1/slip44:60
      amount: 4100000000000000
    total_budget:
      asset: eip155:1/slip44:60
      amount: 102500000000000000
    allow_replacement: false
