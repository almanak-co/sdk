# Operator execution context for a fork run of strategies/curve_base_stable_lp. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:8453
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: proportional
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:8453
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
  - name: single_coin
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:8453
          environment: mainnet
        address: '0x0000000000000000000000000000000000000002'
fork:
  anchors:
  - chain: eip155:8453
    height: 51021941
    reference: '0xdd71e1865990e00214d23e7fb95112b9fb124f3b0b174f5fa870b15e98d12a02'
  funds:
  - kind: safe_roles
    account: proportional
    operator: operator
    assets:
    - asset: eip155:8453/erc20:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
      amount: 10000000
  - kind: safe_roles
    account: single_coin
    operator: operator
    assets:
    - asset: eip155:8453/erc20:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
      amount: 10000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:8453/slip44:60
      amount: 1000000000000000000
