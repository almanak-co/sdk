# Operator execution context for a fork run of strategies/morpho_blue_hyperevm_lending. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:999
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: lender
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:999
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
  - name: borrower
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:999
          environment: mainnet
        address: '0x0000000000000000000000000000000000000002'
fork:
  # A 3,000,000-gas small block, so fixture transactions meet the limit mainnet
  # transactions without big-block opt-in do.
  anchors:
  - chain: eip155:999
    height: 49017682
    reference: '0xd6e25a1a30734e9231ff1256c22710f7574fbc563202c8e97b6668babd5da229'
  funds:
  - kind: safe_roles
    account: lender
    operator: operator
    assets:
    - asset: eip155:999/erc20:0xb88339cb7199b77e23db6e890353e22632ba630f
      amount: 1000000000
  - kind: safe_roles
    account: borrower
    operator: operator
    assets:
    - asset: eip155:999/erc20:0x5555555555555555555555555555555555555555
      amount: 20000000000000000000
    - asset: eip155:999/erc20:0xb88339cb7199b77e23db6e890353e22632ba630f
      amount: 20000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:999/slip44:2457
      amount: 5000000000000000000
