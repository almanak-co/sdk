# Operator execution context for a fork run of strategies/curve_arbitrum_twocrypto_lp. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:42161
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: proportional
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:42161
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
  - name: single_coin
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:42161
          environment: mainnet
        address: '0x0000000000000000000000000000000000000002'
fork:
  anchors:
  - chain: eip155:42161
    height: 502893237
    reference: '0x76975c5580d4d6d006d0eeabc1b9957e790c1361989ceb355d3442ca66853491'
  funds:
  - kind: safe_roles
    account: proportional
    operator: operator
    assets:
    - asset: eip155:42161/erc20:0x82af49447d8a07e3bd95bd0d56f35241523fbab1
      amount: 10000000000000000
  - kind: safe_roles
    account: single_coin
    operator: operator
    assets:
    - asset: eip155:42161/erc20:0x82af49447d8a07e3bd95bd0d56f35241523fbab1
      amount: 10000000000000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:42161/slip44:60
      amount: 1000000000000000000
