# Operator execution context for a fork run of strategies/morpho_blue_avalanche_lending. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:43114
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: lender
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:43114
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
  - name: borrower
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:43114
          environment: mainnet
        address: '0x0000000000000000000000000000000000000002'
fork:
  anchors:
  - chain: eip155:43114
    height: 94864140
    reference: '0xdd2be4027d9261203dd9035b2969f2fd1a17d4ba63542264e1bb4d6d13c01b7a'
  funds:
  - kind: safe_roles
    account: lender
    operator: operator
    assets:
    - asset: eip155:43114/erc20:0xb31f66aa3c1e785363f0875a1b74e27b85fd66c7
      amount: 1000000000000000000
  - kind: safe_roles
    account: borrower
    operator: operator
    assets:
    - asset: eip155:43114/erc20:0xa25eaf2906fa1a3a13edac9b9657108af7b703e3
      amount: 1000000000000000000
    - asset: eip155:43114/erc20:0xb31f66aa3c1e785363f0875a1b74e27b85fd66c7
      amount: 10000000000000000
  operators:
