# Operator execution context for a fork run of strategies/curve_bnb_twocrypto_lp. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:56
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: proportional
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:56
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
  - name: single_coin
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:56
          environment: mainnet
        address: '0x0000000000000000000000000000000000000002'
fork:
  anchors:
  - chain: eip155:56
    height: 120628007
    reference: '0xf008198218320ccaaee388f2a892761d232fd609f6551da421fc1b11fcb748e4'
  funds:
  - kind: safe_roles
    account: proportional
    operator: operator
    assets:
    - asset: eip155:56/erc20:0x85375d3e9c4a39350f1140280a8b0de6890a40e7
      amount: 1000000000000000000
  - kind: safe_roles
    account: single_coin
    operator: operator
    assets:
    - asset: eip155:56/erc20:0x85375d3e9c4a39350f1140280a8b0de6890a40e7
      amount: 1000000000000000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:56/slip44:714
      amount: 1000000000000000000
