# Operator execution context for a fork run of strategies/polygon_aave_borrow_and_trade_v3. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:137
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: fund
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:137
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
fork:
  anchors:
  - chain: eip155:137
    height: 93460480
    reference: '0xd6c4e6be72e45f3cc889082fb025339c72c557ae85025af48b529ad3f48ab6e7'
  funds:
  - kind: safe_roles
    account: fund
    operator: operator
    assets:
    - asset: eip155:137/erc20:0x7ceb23fd6bc0add59e62ac25578270cff1b9f619
      amount: 10000000000000000
    - asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
      amount: 1000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:137/slip44:966
      amount: 5000000000000000000
