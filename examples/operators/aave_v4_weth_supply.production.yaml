# Operator execution context for a production run of strategies/aave_v4_weth_supply.
# Replace the fund address and the signing references with reviewed operator
# files outside strategy-readable paths. `almanak check --production --online`
# never opens signing files; `almanak run --production` refuses execution until
# the referenced files exist and the account passes funding admission.
schema_version: operator-gateway-config-v1
modes:
- production
networks:
- chain: eip155:1
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: treasury
    profile:
      kind: eoa
      fund:
        chain: {chain_id: eip155:1, environment: mainnet}
        address: '0x1111111111111111111111111111111111111111'
production:
  networks:
  - chain: eip155:1
    max_observation_age_seconds: 120
  payers:
  - accounts: [treasury]
    max_gas_price_wei: 5000000000
    max_gas_limit: 1000000
    max_transaction_fee:
      asset: eip155:1/slip44:60
      amount: 5000000000000000
    total_budget:
      asset: eip155:1/slip44:60
      amount: 30000000000000000
    allow_replacement: false
  signing:
    key_file: /private/operator/keystores.json
    password_file: /private/operator/keystore-password
