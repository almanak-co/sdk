# Operator execution context for a fork run of strategies/uniswap_v4_lp. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:1
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: lp
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:1
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
fork:
  anchors:
  - chain: eip155:1
    height: 25908472
    reference: '0xebd2f4a6612e094a8db8d1ab770970f7060bdaf3a18a49e4274f8935d5348ea0'
  funds:
  - kind: safe_roles
    account: lp
    operator: operator
    assets:
    - asset: eip155:1/erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
      amount: 100000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:1/slip44:60
      amount: 1000000000000000000
