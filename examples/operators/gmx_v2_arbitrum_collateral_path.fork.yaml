    height: 502851450
    reference: '0xa0de844b58e42c6639f5f08493a8ea51d62d627f9ae3aad4f7cc8ed4608b0664'
  funds:
  - kind: safe_roles
    account: fund
    operator: operator
    assets:
    - asset: eip155:42161/erc20:0x82af49447d8a07e3bd95bd0d56f35241523fbab1
      amount: 500000000000000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:42161/slip44:60
      amount: 100000000000000000000
  gas:
  - accounts:
    - fund
    max_gas_price_wei: 130434782
    max_gas_limit: 2300000
    max_transaction_fee:
