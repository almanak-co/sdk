# Operator execution context for a fork run of strategies/aave_v4_avalanche_borrowing. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:43114
  provider:
    kind: rpc_url
    url_env: AVALANCHE_RPC_URL
accounts:
  bindings:
  - name: avalanche_fund
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:43114
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
fork:
  anchors:
  - chain: eip155:43114
    height: 94581397
    reference: '0xabb1529862e4b99fdbd08e9c056edc97b00441407043ba18d45b0d1cb7c6297a'
  funds:
  - kind: safe_roles
    account: avalanche_fund
    operator: avalanche_operator
    assets:
    - asset: eip155:43114/erc20:0xb31f66aa3c1e785363f0875a1b74e27b85fd66c7
      amount: 10000000000000000000
    - asset: eip155:43114/erc20:0xb97ef9ef8734c71904d8002f8b6bc66dd9c48a6e
      amount: 1000000
  operators:
  - name: avalanche_operator
    native_balance:
      asset: eip155:43114/slip44:9005
      amount: 1000000000000000000
  gas:
  - accounts:
    - avalanche_fund
    max_gas_price_wei: 1000000000000
    max_gas_limit: 2000000
    max_transaction_fee:
      asset: eip155:43114/slip44:9005
      amount: 200000000000000000
    total_budget:
      asset: eip155:43114/slip44:9005
      amount: 1000000000000000000
    allow_replacement: false
