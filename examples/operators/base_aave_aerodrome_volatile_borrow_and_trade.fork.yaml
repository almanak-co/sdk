# Operator execution context for a fork run of strategies/base_aave_aerodrome_volatile_borrow_and_trade. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:8453
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: fund
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:8453
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
fork:
  anchors:
  - chain: eip155:8453
    height: 50995893
    reference: '0x575f249ea988ea4ebade5a8864be234d902b81a974a472b469d26ba4e7507f08'
  funds:
  - kind: safe_roles
    account: fund
    operator: operator
    assets:
    - asset: eip155:8453/erc20:0x4200000000000000000000000000000000000006
      amount: 10000000000000000
    - asset: eip155:8453/erc20:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
      amount: 1000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:8453/slip44:60
      amount: 5000000000000000000
