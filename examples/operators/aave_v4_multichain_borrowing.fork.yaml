# Operator execution context for a fork run of strategies/aave_v4_multichain_borrowing. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:1
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
- chain: eip155:43114
  provider:
    kind: rpc_url
    url_env: AVALANCHE_RPC_URL
accounts:
  bindings:
  - name: ethereum_fund
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:1
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
  - name: avalanche_fund
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:43114
          environment: mainnet
        address: '0x0000000000000000000000000000000000000002'
fork:
  anchors:
  - chain: eip155:1
    height: 25908472
    reference: '0xebd2f4a6612e094a8db8d1ab770970f7060bdaf3a18a49e4274f8935d5348ea0'
  - chain: eip155:43114
    height: 94581397
    reference: '0xabb1529862e4b99fdbd08e9c056edc97b00441407043ba18d45b0d1cb7c6297a'
  funds:
  - kind: safe_roles
    account: ethereum_fund
    operator: ethereum_operator
    assets:
    - asset: eip155:1/erc20:0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2
      amount: 10000000000000000
    - asset: eip155:1/erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
      amount: 1000000
  - kind: safe_roles
    account: avalanche_fund
    operator: avalanche_operator
    assets:
    - asset: eip155:43114/erc20:0xb31f66aa3c1e785363f0875a1b74e27b85fd66c7
      amount: 10000000000000000000
    - asset: eip155:43114/erc20:0xb97ef9ef8734c71904d8002f8b6bc66dd9c48a6e
      amount: 1000000
  operators:
  - name: ethereum_operator
    native_balance:
      asset: eip155:1/slip44:60
      amount: 1000000000000000000
  - name: avalanche_operator
    native_balance:
      asset: eip155:43114/slip44:9005
      amount: 1000000000000000000
  gas:
