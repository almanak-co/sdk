# Operator execution context for a fork run of strategies/morpho_blue_robinhood_lending. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:4663
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: lender
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:4663
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
  - name: borrower
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:4663
          environment: mainnet
        address: '0x0000000000000000000000000000000000000002'
fork:
  anchors:
  - chain: eip155:4663
    height: 58238929
    reference: '0x814d1db8d8b72f4d7a22acd369ee072101b8b4a5828dc6e620170f74ff67b639'
  funds:
  - kind: safe_roles
    account: lender
    operator: operator
    assets:
    - asset: eip155:4663/erc20:0x5fc5360d0400a0fd4f2af552add042d716f1d168
      amount: 1000000000
  - kind: safe_roles
    account: borrower
    operator: operator
    assets:
    - asset: eip155:4663/erc20:0x0bd7d308f8e1639fab988df18a8011f41eacad73
      amount: 1000000000000000000
    - asset: eip155:4663/erc20:0x5fc5360d0400a0fd4f2af552add042d716f1d168
      amount: 20000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:4663/slip44:60
      amount: 5000000000000000000
