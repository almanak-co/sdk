# Operator execution context for a fork run of strategies/base_morpho_leverage_loop. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:8453
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: fund
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:8453
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
fork:
  # OP Stack forks cannot bound L1 data and operator fees, so this fork runs
  # gasless; the authored strategy.gas is retained but not enforced.
  author_gas: unenforced
  anchors:
  - chain: eip155:8453
    height: 51004948
    reference: '0x4c9f6b09b13b1b66c54e30acc06f79d8a4ff8d01db6c3386149453c840c859e1'
  funds:
  - kind: safe_roles
    account: fund
    operator: operator
    assets:
    - asset: eip155:8453/erc20:0x4200000000000000000000000000000000000006
      amount: 50000000000000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:8453/slip44:60
      amount: 5000000000000000000
