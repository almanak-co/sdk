# Operator execution context for a fork run of strategies/curve_avalanche_stable_lp. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:43114
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: proportional
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:43114
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
  - name: single_coin
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:43114
          environment: mainnet
        address: '0x0000000000000000000000000000000000000002'
fork:
  anchors:
  - chain: eip155:43114
    height: 94749304
    reference: '0x5d36439deae6b96a4795f43233f0a31ed065c3267322fde6539ccfeb567a6cca'
  funds:
  - kind: safe_roles
    account: proportional
    operator: operator
    assets:
    - asset: eip155:43114/erc20:0xb97ef9ef8734c71904d8002f8b6bc66dd9c48a6e
      amount: 100000
  - kind: safe_roles
    account: single_coin
    operator: operator
    assets:
    - asset: eip155:43114/erc20:0xb97ef9ef8734c71904d8002f8b6bc66dd9c48a6e
      amount: 100000
  operators:
  - name: operator
    native_balance:
      asset: eip155:43114/slip44:9005
      amount: 1000000000000000000
