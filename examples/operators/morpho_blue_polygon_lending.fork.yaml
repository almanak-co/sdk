# Operator execution context for a fork run of strategies/morpho_blue_polygon_lending. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:137
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: lender
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:137
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
  - name: borrower
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:137
          environment: mainnet
        address: '0x0000000000000000000000000000000000000002'
fork:
  anchors:
  - chain: eip155:137
    height: 93459428
    reference: '0xf2a07ecb96cf887f198189df9c0e2a646008ef2cfd9827deb10402336fb45ec3'
  funds:
  - kind: safe_roles
    account: lender
    operator: operator
    assets:
    - asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
      amount: 1000000000
  - kind: safe_roles
    account: borrower
    operator: operator
    assets:
    - asset: eip155:137/erc20:0x7ceb23fd6bc0add59e62ac25578270cff1b9f619
      amount: 1000000000000000000
    - asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
      amount: 20000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:137/slip44:966
      amount: 10000000000000000000
