# Operator execution context for a fork run of strategies/gmx_v2_avalanche_position_path. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:43114
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: fund
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:43114
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
fork:
  anchors:
  - chain: eip155:43114
    height: 94733400
    reference: '0x3c57a273d20b7c0507063f3075a52e6496729bf0ea0fee2f66ebb02be1babb1b'
  funds:
  - kind: safe_roles
    account: fund
    operator: operator
    assets:
    - asset: eip155:43114/erc20:0xb31f66aa3c1e785363f0875a1b74e27b85fd66c7
      amount: 50000000000000000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:43114/slip44:9005
      amount: 1000000000000000000000
