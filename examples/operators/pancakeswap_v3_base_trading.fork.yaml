# Operator execution context for a fork run of strategies/pancakeswap_v3_base_trading. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:8453
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: fund
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:8453
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
fork:
  anchors:
  - chain: eip155:8453
    height: 50992857
    reference: '0x5aa8b1bcaba8b741cc82b4cf319e3cce2ce85d16a9e7ebe70b01275cc2db0306'
  funds:
  - kind: safe_roles
    account: fund
    operator: operator
    assets:
    - asset: eip155:8453/erc20:0x4200000000000000000000000000000000000006
      amount: 100000000000000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:8453/slip44:60
      amount: 1000000000000000000
