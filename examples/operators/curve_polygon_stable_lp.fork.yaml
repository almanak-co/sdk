# Operator execution context for a fork run of strategies/curve_polygon_stable_lp. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:137
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: proportional
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:137
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
  - name: single_coin
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:137
          environment: mainnet
        address: '0x0000000000000000000000000000000000000002'
fork:
  anchors:
  - chain: eip155:137
    height: 93427995
    reference: '0xd21e7dd3f6f73ece6c9c1b1dd2bd2f92fb30dacde017eab616464bfefc790519'
  funds:
  - kind: safe_roles
    account: proportional
    operator: operator
    assets:
    - asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
      amount: 10000000
  - kind: safe_roles
    account: single_coin
    operator: operator
    assets:
    - asset: eip155:137/erc20:0x3c499c542cef5e3811e1192ce70d8cc03d5c3359
      amount: 10000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:137/slip44:966
      amount: 10000000000000000000
