# Operator execution context for a fork run of strategies/curve_ethereum_twocrypto_lp. Provider
# credentials stay in the selected --env-file. The account bindings are
# placeholders: fork provisioning generates the actual fixture accounts, and a
# production run requires reviewed bindings and signing files outside
# strategy-readable paths.
schema_version: operator-gateway-config-v1
modes:
- fork
networks:
- chain: eip155:1
  provider:
    kind: alchemy
    api_key_env: ALCHEMY_API_KEY
accounts:
  bindings:
  - name: proportional
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:1
          environment: mainnet
        address: '0x0000000000000000000000000000000000000001'
  - name: single_coin
    profile:
      kind: eoa
      fund:
        chain:
          chain_id: eip155:1
          environment: mainnet
        address: '0x0000000000000000000000000000000000000002'
fork:
  anchors:
  - chain: eip155:1
    height: 25927618
    reference: '0x783313acbaec87be0f17b177869bda557bb634e4c810d17a072c55521937e6ad'
  funds:
  - kind: safe_roles
    account: proportional
    operator: operator
    assets:
    - asset: eip155:1/erc20:0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2
      amount: 10000000000000000
  - kind: safe_roles
    account: single_coin
    operator: operator
    assets:
    - asset: eip155:1/erc20:0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2
      amount: 10000000000000000
  operators:
  - name: operator
    native_balance:
      asset: eip155:1/slip44:60
      amount: 1000000000000000000
  gas:
  - accounts:
    - proportional
    - single_coin
    max_gas_price_wei: 3416666666
    max_gas_limit: 1200000
    max_transaction_fee:
      asset: eip155:1/slip44:60
      amount: 4100000000000000
    total_budget:
      asset: eip155:1/slip44:60
      amount: 114800000000000000
    allow_replacement: false
